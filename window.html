  const loadWindow = makeWindow(document.getElementById('loadWindow'));
  const loadFile = document.getElementById('loadFile');
  const loadFileName = document.getElementById('loadFileName');
  const loadNameInput = document.getElementById('loadName');
  const loadDataset = document.getElementById('loadDataset');
  const loadArch = document.getElementById('loadArch');
  const loadAcc = document.getElementById('loadAcc');
  const loadDesc = document.getElementById('loadDesc');
  const confirmLoadBtn = document.getElementById('confirmLoadBtn');

  document.getElementById('chooseFileBtn').addEventListener('click', () => loadFile.click());

  loadFile.addEventListener('change', () => {
    const file = loadFile.files[0];
    loadFileName.textContent = file ? file.name : 'no file chosen';
    loadFileName.classList.toggle('chosen', !!file);
    // The file name is a sensible default for the model name
    if (file && !loadNameInput.value.trim()) {
      loadNameInput.value = file.name.replace(/\.(pt|pth)$/i, '').replace(/[^\w\- ]+/g, '-');
    }
  });

  document.getElementById('loadModelBtn').addEventListener('click', async () => {
    loadDataset.value = pickerDataset;
    await refreshArchitectures(loadArch);
    loadWindow.open();
    loadNameInput.focus();
  });

  function flashLoad(text) {
    confirmLoadBtn.textContent = text;
    setTimeout(() => { confirmLoadBtn.textContent = 'load model'; }, 2000);
  }

  async function uploadModel() {
    const file = loadFile.files[0];
    if (!file) return flashLoad('pick a file');
    if (!loadNameInput.value.trim()) return flashLoad('name it first');
    if (!loadArch.value) return flashLoad('pick an architecture');

    const params = new URLSearchParams({
      name: loadNameInput.value.trim(),
      model: loadArch.value,
      dataset: loadDataset.value,
      description: loadDesc.value,
    });
    // Accuracy is stored as a fraction, like the trained models write it
    const accuracy = parseFloat(loadAcc.value);
    if (Number.isFinite(accuracy)) params.set('accuracy', `${accuracy / 100}`);

    confirmLoadBtn.textContent = 'loading...';
    try {
      const res = await fetch(`/api/upload?${params}`, { method: 'POST', body: file });
      const data = await res.json();
      if (!res.ok) {
        flashLoad(typeof data.detail === 'string' ? data.detail : 'failed');
        return;
      }
      console.log('loaded model into', data.path);
      loadFile.value = '';
      loadFileName.textContent = 'no file chosen';
      loadFileName.classList.remove('chosen');
      loadNameInput.value = '';
      loadAcc.value = '';
      loadDesc.value = '';
      confirmLoadBtn.textContent = 'load model';
      loadWindow.close();
      await refreshModels();
    } catch (err) {
      console.error('upload failed:', err);
      flashLoad('failed');
    }
  }

  confirmLoadBtn.addEventListener('click', uploadModel);
  loadNameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') uploadModel();
  });

  // Save: name and description for the last trained model, saved straight from the train window
  const modelNameInput = document.getElementById('modelName');
  const modelDescInput = document.getElementById('modelDesc');
  const saveBtn = document.getElementById('saveBtn');

  function flashSave(text) {
    saveBtn.textContent = text;
    setTimeout(() => { saveBtn.textContent = 'save model'; }, 1500);
  }

  async function saveModel() {
    try {
      const res = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: modelNameInput.value.trim(), description: modelDescInput.value }),
      });
      const data = await res.json();
      if (!res.ok) {
        flashSave(typeof data.detail === 'string' ? data.detail : 'invalid name');
        return;
      }
      console.log('saved model to', data.path);
      modelNameInput.value = '';
      modelDescInput.value = '';
      flashSave('saved');
    } catch (err) {
      console.error('save failed:', err);
      flashSave('save failed');
    }
  }

  saveBtn.addEventListener('click', saveModel);
  modelNameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && trainFlow.classList.contains('has-model')) saveModel();
  });

  // Submit: send the drawing to the selected model, show the predicted digit
  const submitBtn = document.getElementById('submitBtn');
  const outputSquare = document.getElementById('outputSquare');

  function flashSubmit(text) {
    submitBtn.textContent = text;
    setTimeout(() => { submitBtn.textContent = 'submit'; }, 1500);
  }

  // Canvas is black on white; MNIST is white on black, so invert
  function readPixels() {
    const { data } = ctx.getImageData(0, 0, SIZE, SIZE);
    const pixels = [];
    for (let y = 0; y < SIZE; y++) {
      const row = [];
      for (let x = 0; x < SIZE; x++) row.push(255 - data[(y * SIZE + x) * 4]);
      pixels.push(row);
    }
    return pixels;
  }

  const confValue = document.getElementById('confValue');
  let predictRequest = 0;

  submitBtn.addEventListener('click', async () => {
    if (!selected['MNIST']) {
      flashSubmit('pick a model');
      return;
    }

    // Loading state; the id makes sure only the latest submit shows its result
    const id = ++predictRequest;
    outputSquare.innerHTML = '<div class="spinner"></div>';
    confValue.textContent = '';

    try {
      const res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: selected['MNIST'], dataset: 'MNIST', pixels: readPixels() }),
      });
      const data = await res.json();
      if (id !== predictRequest) return;

      if (!res.ok) {
        outputSquare.textContent = '';
        flashSubmit(typeof data.detail === 'string' ? data.detail : 'failed');
        return;
      }
      outputSquare.textContent = data.label;
      confValue.textContent = `${(data.probabilities[data.digit] * 100).toFixed(1)}%`;
    } catch (err) {
      if (id !== predictRequest) return;
      console.error('predict failed:', err);
      outputSquare.textContent = '';
      flashSubmit('failed');
    }
  });

  // Dream window: the server optimises an image to maximise the picked digit's score,
  // which shows what the model thinks that digit looks like

  const dreamDigitInput = document.getElementById('dreamDigit');
  const dreamBtn = document.getElementById('dreamBtn');
  const dreamConfValue = document.getElementById('dreamConfValue');
  const dreamCtx = document.getElementById('dreamCanvas').getContext('2d');
  let dreamRequest = 0;

  // Constraints on the image, all on by default; turn them all off for pure gradient ascent
  const DREAM_TOGGLES = [
    { name: 'sparse', label: 'sparsity (L2)' },
    { name: 'smooth', label: 'smoothness (TV)' },
    { name: 'jitter', label: 'jitter' },
    { name: 'clamp',  label: 'clamp to 0-1' },
  ];
  const dreamToggles = document.getElementById('dreamToggles');

  for (const toggle of DREAM_TOGGLES) {
    const btn = document.createElement('button');
    btn.className = 'on';
    btn.dataset.name = toggle.name;
    btn.textContent = toggle.label;
    btn.addEventListener('click', () => btn.classList.toggle('on'));
    dreamToggles.append(btn);
  }

  function readToggles() {
    return Object.fromEntries([...dreamToggles.children].map(btn =>
      [btn.dataset.name, btn.classList.contains('on')]
    ));
  }

  // One digit only: typing replaces it, anything that isn't 0-9 is dropped
  dreamDigitInput.addEventListener('input', () => {
    dreamDigitInput.value = dreamDigitInput.value.replace(/\D/g, '').slice(-1);
  });
  dreamDigitInput.addEventListener('keydown', e => {
    if (/^\d$/.test(e.key)) {
      e.preventDefault();
      dreamDigitInput.value = e.key;
    } else if (e.key === 'Enter') {
      dreamBtn.click();
    }
  });

  function clearDream() {
    dreamCtx.fillStyle = '#fff';
    dreamCtx.fillRect(0, 0, SIZE, SIZE);
    dreamConfValue.textContent = '';
  }

  clearDream();

  function flashDream(text) {
    dreamBtn.textContent = text;
    setTimeout(() => { dreamBtn.textContent = 'dream'; }, 1500);
  }

  // The server sends white on black like MNIST; shown black on white like the drawing canvas
  function drawDream(pixels) {
    const image = dreamCtx.createImageData(SIZE, SIZE);
    pixels.flat().forEach((v, i) => {
      image.data.set([255 - v, 255 - v, 255 - v, 255], i * 4);
    });
    dreamCtx.putImageData(image, 0, 0);
  }

  dreamBtn.addEventListener('click', async () => {
    if (!selected['MNIST']) return flashDream('pick a model');
    if (!dreamDigitInput.value) return flashDream('type a digit');

    const id = ++dreamRequest;
    const digit = Number(dreamDigitInput.value);
    dreamBtn.textContent = 'dreaming...';

    try {
      const res = await fetch('/api/dream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: selected['MNIST'], digit, ...readToggles() }),
      });
      const data = await res.json();
      if (id !== dreamRequest) return;

      if (!res.ok) {
        flashDream(typeof data.detail === 'string' ? data.detail : 'failed');
        return;
      }
      dreamBtn.textContent = 'dream';
      drawDream(data.pixels);
      dreamConfValue.textContent = `${digit}: ${(data.probabilities[digit] * 100).toFixed(1)}%`;
    } catch (err) {
      if (id !== dreamRequest) return;
      console.error('dream failed:', err);
      clearDream();
      flashDream('failed');
    }
  });

  // Chess boards: drawn from a FEN. The page knows no chess rules; the server sends the legal moves.
  const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

  // Piece images (assets/pieces, the california set): wK.svg is the white king, bP.svg a black pawn
  const pieceImage = piece => {
    const color = piece === piece.toUpperCase() ? 'w' : 'b';
    return `url('/assets/pieces/${color}${piece.toUpperCase()}.svg')`;
  };

  // { square name: piece letter }, uppercase for white
  function parseFen(fen) {
    const pieces = {};
    fen.split(' ')[0].split('/').forEach((row, i) => {
      let file = 0;
      for (const ch of row) {
        if (/\d/.test(ch)) file += Number(ch);
        else pieces[`${'abcdefgh'[file++]}${8 - i}`] = ch;
      }
    });
    return pieces;
  }

  function makeBoard(board) {
    const squares = Array.from({ length: 64 }, () => board.appendChild(document.createElement('div')));
    let flipped = false;

    // Square shown at grid cell i: rank 8 along the top, or rank 1 when flipped for black
    function squareAt(i) {
      const row = Math.floor(i / 8), col = i % 8;
      const file = flipped ? 7 - col : col;
      const rank = flipped ? row : 7 - row;
      return { name: `${'abcdefgh'[file]}${rank + 1}`, light: (file + rank) % 2 === 1 };
    }

    let floating = null;   // a piece mid-slide, see slide()

    // pending: [from, to] of a move sent but not answered yet, shown moved already
    // animate: [from, to] of a move already in the position, to show sliding in
    function draw(fen, { last = null, selected = null, targets = [], pending = null, animate = null } = {}) {
      floating?.finish();
      const pieces = parseFen(fen);
      if (pending) {
        pieces[pending[1]] = pieces[pending[0]];
        delete pieces[pending[0]];
      }
      squares.forEach((sq, i) => {
        const { name, light } = squareAt(i);
        const piece = pieces[name];
        sq.dataset.square = name;
        sq.style.setProperty('--piece', piece ? pieceImage(piece) : 'none');
        sq.className = light ? 'light' : 'dark';
        if (piece) sq.classList.add('occupied');
        if ((pending ?? last)?.includes(name)) sq.classList.add('last');
        if (name === selected) sq.classList.add('selected');
        if (targets.includes(name)) sq.classList.add('target');
      });
      if (animate) slide(...animate);
    }

    // The piece now on `to` is hidden there and drawn moving over from `from`, then shown again
    const SLIDE_MS = 200;   // matches .floating-piece's transition
    function slide(from, to) {
      const fromSq = squares.find(sq => sq.dataset.square === from);
      const toSq = squares.find(sq => sq.dataset.square === to);
      const piece = toSq.style.getPropertyValue('--piece');
      if (!piece || piece === 'none') return;

      const el = document.createElement('div');
      el.className = 'floating-piece';
      el.style.setProperty('--piece', piece);
      el.style.left = `${fromSq.offsetLeft}px`;
      el.style.top = `${fromSq.offsetTop}px`;
      toSq.style.setProperty('--piece', 'none');
      board.append(el);

      // Lay it out at the start first, so the move to the end square is a transition
      el.getBoundingClientRect();
      el.style.transform = `translate(${toSq.offsetLeft - fromSq.offsetLeft}px, ${toSq.offsetTop - fromSq.offsetTop}px)`;

      // A timer rather than transitionend, which never comes if the board isn't being drawn
      const timer = setTimeout(() => floating?.finish(), SLIDE_MS + 30);
      floating = {
        finish() {
          clearTimeout(timer);
          toSq.style.setProperty('--piece', piece);
          el.remove();
          floating = null;
        },
      };
    }

    return { draw, setFlipped: value => { flipped = value; } };
  }

  // Play window: you against the selected model. Promotions are always to a queen, like the model's.
  const chessBoard = makeBoard(document.getElementById('chessBoard'));

  // The play board's texture: a grain-bg preset (see assets/grain-bg.js), so it gets the same film
  // grain as the cyanotype window around it. The light squares are the base, the dark squares solid
  // blocks, and a few big blurred blocks on top are faint uneven ink, like the background's.
  // Square colours come from the board's CSS (--light, --dark, --mark).
  const BOARD_TEXTURE = (() => {
    const css = getComputedStyle(document.getElementById('chessBoard'));
    const rgb = name => {
      const hex = css.getPropertyValue(name).trim().slice(1);
      return [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
    };
    const ink = css.getPropertyValue('--mark').split(',').map(Number);

    // a1 is dark; every square whose file + rank is even is too. The pattern is the same flipped.
    const squares = [];
    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        if ((col + 7 - row) % 2 === 0) {
          squares.push({ x: col / 8, y: row / 8, w: 1 / 8, h: 1 / 8, c: rgb('--dark'), a: 1, blur: 0 });
        }
      }
    }

    return {
      base: rgb('--light'),
      grain: 16,
      darkGrain: 0.6,
      blobs: [],
      rects: [
        ...squares,
        { x: -0.1, y: -0.1, w: 0.55, h: 0.5,  c: ink,           a: 0.10, blur: 0.12 },  // ink, top left
        { x: 0.55, y: 0.6,  w: 0.55, h: 0.5,  c: ink,           a: 0.12, blur: 0.12 },  // ink, bottom right
        { x: 0.55, y: 0.05, w: 0.35, h: 0.35, c: [255, 255, 255], a: 0.10, blur: 0.10 }, // pale wash, top right
      ],
    };
  })();
  mountCanvasBg(document.querySelector('#chessBoard > .board-bg'), c => paintGrainBg(c, BOARD_TEXTURE));
  const chessNewBtn = document.getElementById('chessNewBtn');
  const chessSideBtn = document.getElementById('chessSideBtn');
  const chess ={ fen: START_FEN, legal: [], last: null, status: null, side: 'w', selected: null, pending: null };
  let chessRequest = 0;

  // animate: [from, to] of a move to show sliding into place
  function drawChess(animate = null) {
    const { fen, last, selected, pending, legal } = chess;
    const targets = selected ? legal.filter(m => m.startsWith(selected)).map(m => m.slice(2, 4)) : [];
    chessBoard.draw(fen, { last, selected, targets, pending, animate });
  }

  // The new game button says how the game ended until the next one starts, and flashes errors
  const chessNewLabel = () => {
    if (!chess.status) return 'new game';
    const [how, who] = chess.status.split(' - ');   // e.g. "checkmate - white wins", "draw - stalemate"
    if (how === 'draw') return `draw - ${who}`;
    return who.startsWith(chess.side === 'w' ? 'white' : 'black') ? 'you win!' : 'model wins';
  };

  function flashChess(text) {
    chessNewBtn.textContent = text;
    setTimeout(() => { chessNewBtn.textContent = chessNewLabel(); }, 1500);
  }

  // Sends a position (and the player's move, if any) and takes on the position that comes back
  async function chessPlay(body) {
    const id = ++chessRequest;
    let animate = null;

    try {
      // The player's own move slides first, so the reply waits for it to land
      const [res] = await Promise.all([
        fetch('/api/chess/play', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }),
        body.move ? new Promise(resolve => setTimeout(resolve, 220)) : null,
      ]);
      const data = await res.json();
      if (id !== chessRequest) return;

      chess.pending = null;
      if (!res.ok) {
        flashChess(typeof data.detail === 'string' ? data.detail : 'failed');
        return;
      }
      Object.assign(chess, { fen: data.fen, legal: data.legal, last: data.last, status: data.status });
      chessNewBtn.textContent = chessNewLabel();
      if (data.reply) animate = data.last;
    } catch (err) {
      if (id !== chessRequest) return;
      console.error('chess move failed:', err);
      chess.pending = null;
      flashChess('failed');
    } finally {
      if (id === chessRequest) drawChess(animate);
    }
  }

  function newGame() {
    chessRequest++;   // drop any reply still on its way
    Object.assign(chess, { fen: START_FEN, legal: [], last: null, status: null, selected: null, pending: null });
    chessNewBtn.textContent = chessNewLabel();
    chessBoard.setFlipped(chess.side === 'b');
    drawChess();

    // Playing black, the model opens
    if (chess.side === 'b') {
      if (!selected['Lichess']) return flashChess('pick a model');
      chessPlay({ fen: START_FEN, model: selected['Lichess'] });
    } else {
      chessPlay({ fen: START_FEN, reply: false });
    }
  }

  chessNewBtn.addEventListener('click', newGame);

  chessSideBtn.addEventListener('click', () => {
    chess.side = chess.side === 'w' ? 'b' : 'w';
    chessSideBtn.textContent = chess.side === 'w' ? 'playing white' : 'playing black';
    newGame();
  });

  // Click a piece to see where it can go, then click where to move it
  document.getElementById('chessBoard').addEventListener('click', e => {
    const square = e.target.closest('[data-square]')?.dataset.square;
    const yourTurn = chess.fen.split(' ')[1] === chess.side;
    if (!square || chess.status || chess.pending || !yourTurn) return;

    const from = chess.selected;
    const moves = from ? chess.legal.filter(m => m.slice(0, 4) === from + square) : [];
    if (moves.length) {
      if (!selected['Lichess']) return flashChess('pick a model');
      // A pawn reaching the last rank has a move per piece; take the queen
      const move = moves.find(m => m.length === 4 || m.endsWith('q'));
      chess.selected = null;
      chess.pending = [from, square];
      drawChess(chess.pending);
      chessPlay({ fen: chess.fen, model: selected['Lichess'], move });
      return;
    }

    // Select one of your pieces (clicking it again lets go)
    const ownPiece = chess.legal.some(m => m.startsWith(square));
    chess.selected = ownPiece && square !== from ? square : null;
    drawChess();
  });

  newGame();

  // Elo window: a match against Stockfish held to a set rating. The score gives the model's rating,
  // with a 95% range that narrows as more games are played.
  const eloBoard = makeBoard(document.getElementById('eloBoard'));
  const eloStartBtn = document.getElementById('eloStartBtn');
  const eloSettings = document.getElementById('eloSettings');
  const eloProgress = document.getElementById('eloProgress');
  const eloValue = document.getElementById('eloValue');
  const eloRange = document.getElementById('eloRange');
  const eloTally = document.getElementById('eloTally');
  let eloSocket = null;
  let eloPosition = null;   // latest move update, drawn once per frame
  // The last match's latest rating and what it was measured with: { model, opponent, update }
  let eloResult = null;
  const eloSaveBtn = document.getElementById('eloSaveBtn');

  // Saving needs a finished (or stopped) match with an actual number, not "<1320"
  function refreshEloSave() {
    eloSaveBtn.disabled = !eloResult || eloResult.update.elo == null || !!eloSocket;
  }

  async function saveElo() {
    const { model, opponent, update } = eloResult;
    const flash = text => {
      eloSaveBtn.textContent = text;
      setTimeout(() => { eloSaveBtn.textContent = 'save elo'; }, 1500);
    };
    try {
      const res = await fetch(`/api/models/${encodeURIComponent(model)}/elo`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          elo: update.elo, low: update.low, high: update.high, opponent,
          games: update.game, wins: update.wins, draws: update.draws, losses: update.losses,
        }),
      });
      const data = await res.json();
      if (!res.ok) return flash(typeof data.detail === 'string' ? data.detail : 'failed');
      flash('saved');
      await refreshModels();   // the model boxes and cards show the new rating
    } catch (err) {
      console.error('saving elo failed:', err);
      flash('failed');
    }
  }

  eloSaveBtn.addEventListener('click', saveElo);

  eloBoard.draw(START_FEN);

  function setEloRunning(running) {
    eloStartBtn.classList.toggle('running', running);
    eloStartBtn.textContent = running ? 'stop match' : 'start match';
    eloSettings.classList.toggle('running', running);
    refreshEloSave();
  }

  function flashElo(text) {
    eloStartBtn.textContent = text;
    setTimeout(() => setEloRunning(!!eloSocket), 1500);
  }

  function showEloGame(update, opponent, model) {
    eloResult = { model, opponent, update };
    eloProgress.textContent = `${update.game} / ${update.games} played`;
    eloTally.textContent = `${update.wins} won · ${update.draws} drawn · ${update.losses} lost`;
    if (update.elo != null) {
      eloValue.textContent = Math.round(update.elo);
      eloRange.textContent = `${Math.round(update.low)} – ${Math.round(update.high)}`;
    } else {
      // All lost or all won: the rating is only known to be below or above the opponent's
      eloValue.textContent = update.score === 0 ? `<${opponent}` : `>${opponent}`;
      eloRange.textContent = update.score === 0 ? 'lost every game' : 'won every game';
    }
  }

  function endMatch() {
    if (eloSocket) eloSocket.close();
    eloSocket = null;
    setEloRunning(false);
  }

  function startMatch() {
    if (!selected['Lichess']) return flashElo('pick a model');
    const opponent = Number(document.getElementById('eloOpponent').value);
    const games = Number(document.getElementById('eloGames').value);

    eloValue.textContent = '';
    eloRange.textContent = '';
    eloTally.textContent = '';
    eloProgress.textContent = `0 / ${games} played`;
    eloBoard.draw(START_FEN);
    eloResult = null;

    const socket = new WebSocket(`ws://${location.host}/ws/elo`);
    eloSocket = socket;
    setEloRunning(true);

    // Kept, so the rating is saved to the model it was measured for even if another is picked since
    const model = selected['Lichess'];
    socket.onopen = () => socket.send(JSON.stringify({ type: 'start', model, elo: opponent, games }));
    socket.onmessage = e => {
      if (socket !== eloSocket) return;
      const update = JSON.parse(e.data);
      switch (update.type) {
        case 'move':
          // The board faces the model's side; moves come faster than frames, so only the latest is drawn
          if (!eloPosition) requestAnimationFrame(() => {
            eloBoard.setFlipped(!eloPosition.model_white);
            eloBoard.draw(eloPosition.fen, { last: eloPosition.last });
            eloPosition = null;
          });
          eloPosition = update;
          break;
        case 'game':
          showEloGame(update, opponent, model);
          break;
        case 'done':
          endMatch();
          break;
        case 'error':
          console.error('match error:', update.message);
          endMatch();
          flashElo(update.message);
          break;
      }
    };
    socket.onclose = () => {
      if (socket === eloSocket) endMatch();
    };
  }

  function stopMatch() {
    if (eloSocket && eloSocket.readyState === WebSocket.OPEN) {
      eloSocket.send(JSON.stringify({ type: 'cancel' }));
    }
    endMatch();
  }

  eloStartBtn.addEventListener('click', () => (eloSocket ? stopMatch() : startMatch()));

  // Reveal the app once the fonts are in, since they change the windows' sizes (at most a second's wait)
  Promise.race([document.fonts.ready, new Promise(resolve => setTimeout(resolve, 1000))]).then(flow.reveal);

  // Server connection check
  fetch('/api/ping')
    .then(res => res.json())
    .then(data => console.log('server ping:', data))
    .catch(err => console.warn('server not reachable:', err));
</script>
