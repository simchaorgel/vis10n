<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brushstrokes Background</title>
<style>
  html { background: #001A23; }
  html, body { margin: 0; height: 100%; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<script>
// Change SEED to get a different painting
const SEED = 2024;

// Stroke layers, painted back to front. Counts are for a 1440x900 screen and scale with area.
const LAYERS = [
  // broad, dark tonal washes
  { count: 14, width: [180, 320], length: [600, 1200], colors: [['#07303c', 0.45], ['#0a3845', 0.35]] },
  // medium strokes, mostly tonal with some violet
  { count: 40, width: [40, 110], length: [250, 600], colors: [['#0e4250', 0.35], ['#12394d', 0.35], ['#726DA8', 0.16]] },
  // small accent strokes
  { count: 26, width: [10, 30], length: [80, 260], colors: [['#726DA8', 0.3], ['#A0D2DB', 0.12], ['#1a5563', 0.4]] },
];
const BASE_ANGLE = -0.35;   // dominant stroke direction (radians)

// ---------- seeded random + noise ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const P = new Uint8Array(512);
(function () {
  const r = mulberry32(SEED);
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
})();
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (t, a, b) => a + t * (b - a);
function grad(h, x, y) {
  h &= 7;
  const u = h < 4 ? x : y, v = h < 4 ? y : x;
  return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
}
function noise(x, y) {
  let X = Math.floor(x), Y = Math.floor(y);
  x -= X; y -= Y; X &= 255; Y &= 255;
  const u = fade(x), v = fade(y);
  const A = P[X] + Y, B = P[X + 1] + Y;
  return lerp(v,
    lerp(u, grad(P[A], x, y), grad(P[B], x - 1, y)),
    lerp(u, grad(P[A + 1], x, y - 1), grad(P[B + 1], x - 1, y - 1)));
}

// ---------- one brushstroke, built from individual bristles ----------
let bristleId = 0;
function brushstroke(ctx, rnd, x, y, angle, len, width, color, alpha) {
  // centerline with a gentle, slightly wobbly curve
  const steps = Math.max(16, Math.round(len / 6));
  const curve = (rnd() - 0.5) * 0.0009;
  const pts = [];
  let a = angle;
  for (let i = 0; i <= steps; i++) {
    pts.push([x, y, a]);
    x += Math.cos(a) * len / steps;
    y += Math.sin(a) * len / steps;
    a += curve * len / steps + (rnd() - 0.5) * 0.004;
  }

  // bristles overlap so the stroke reads as a painted body with streaks, not loose hairs
  const bristles = Math.max(8, Math.min(140, Math.round(width / 1.8)));
  const spacing = width / bristles;
  const pressure = 0.7 + rnd() * 0.5;       // how loaded the brush is
  const dryness = 0.4 + rnd() * 1.0;        // how fast it runs out of paint
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';

  for (let b = 0; b < bristles; b++) {
    const id = bristleId++;
    const off = (rnd() - 0.5) * width;
    const t0 = rnd() * 0.04, t1 = 1 - rnd() * 0.2;   // ragged start and end
    ctx.lineWidth = spacing * (1.2 + rnd() * 1.8);
    ctx.globalAlpha = alpha * (0.25 + 0.5 * rnd());

    let drawing = false;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      if (t < t0 || t > t1) continue;
      // paint left on this bristle: fades along the stroke, with noisy dry patches
      const ink = pressure - dryness * t * t + noise(id * 0.37, t * 7) * 0.9;
      // blunt, brush-shaped ends: full width almost immediately, slight narrowing at the tail
      const taper = Math.min(1, Math.sqrt(t / 0.05)) * Math.min(1, 0.55 + (1 - t) / 0.25 * 0.45);
      const [cx, cy, ca] = pts[i];
      const px = cx - Math.sin(ca) * off * taper;
      const py = cy + Math.cos(ca) * off * taper;
      if (ink > 0.3) {
        drawing ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        drawing = true;
      } else {
        drawing = false;
      }
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---------- paint ----------
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

function paint() {
  const W = innerWidth, H = innerHeight;
  const DPR = Math.min(2, devicePixelRatio || 1);
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const rnd = mulberry32(SEED);
  bristleId = 0;
  const areaScale = (W * H) / (1440 * 900);
  const between = ([lo, hi]) => lo + rnd() * (hi - lo);

  for (const layer of LAYERS) {
    const n = Math.max(3, Math.round(layer.count * areaScale));
    for (let i = 0; i < n; i++) {
      const len = between(layer.length);
      // mostly one direction, with some strokes crossing it
      const angle = BASE_ANGLE + (rnd() < 0.2 ? 1.3 : 0) + (rnd() - 0.5) * 0.6;
      // start somewhere so the stroke's middle lands on screen
      const mx = rnd() * W, my = rnd() * H;
      const sx = mx - Math.cos(angle) * len / 2, sy = my - Math.sin(angle) * len / 2;
      const [color, alpha] = layer.colors[Math.floor(rnd() * layer.colors.length)];
      brushstroke(ctx, rnd, sx, sy, angle, len, between(layer.width), color, alpha);
    }
  }

  // light canvas-texture grain
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const g = mulberry32(SEED ^ 0x9e3779b9);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (g() - 0.5) * 10;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

// Repaint only after resizing stops
let timer;
addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(paint, 150); });
paint();
</script>
</body>
</html>
