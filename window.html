<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vis10n - test</title>
<style>
  :root {
    --line: #1f1f1f;
    --border: 4px;
    --page: #35464d;
    --panel: #faf8f3;
    --text: #1f1f1f;
    --muted: #6b6760;
    --hover: #efe9dc;
    --square: 224px; /* 28px * 8 */
    --btn-h: 56px;
    --label-h: 40px;
  }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--page);
    font: 15px/1.2 system-ui, sans-serif;
    color: var(--text);
  }

  .window {
    position: absolute;
    border: var(--border) solid var(--line);
    background: var(--line);
    display: flex;
    flex-direction: column;
    gap: var(--border);
  }

  .titlebar {
    background: #2f6fd6;
    color: #fff;
    height: 30px;
    padding: 0 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 14px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }

  .titlebar.dragging {
    cursor: grabbing;
  }

  .titlebar .close {
    /* The border sits outside the red, so the red stays a 30px square */
    width: calc(30px + var(--border));
    height: 30px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5401c;
    border: 0;
    border-left: var(--border) solid var(--line);
    border-radius: 0;
  }

  .titlebar .close:hover {
    background: #f25531;
  }

  .titlebar .close:active {
    background: #c93414;
  }

  /* Cells sit over the line colour; the gaps become the thick borders */
  .content {
    display: flex;
    gap: var(--border);
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: var(--border);
  }

  .col > * {
    background: var(--panel);
  }

  .label {
    height: var(--label-h);
    display: flex;
    align-items: center;
    padding: 0 14px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  button {
    height: var(--btn-h);
    border: 0;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    padding: 0 18px;
    cursor: pointer;
  }

  button:hover {
    background: var(--hover);
  }

  button:active {
    background: #e3dccb;
  }

  [hidden] { display: none !important; }

  /* Launcher: title and buttons, centred on the empty page */
  .launcher {
    position: fixed;
    top: 36%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .launcher h1 {
    margin: 0;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .launcher .launcher-buttons {
    display: flex;
    gap: 28px;
  }

  .launcher button {
    height: auto;
    padding: 14px 30px;
    font-size: 20px;
    font-weight: 700;
    background: #fbf7ef;
    border: var(--border) solid var(--line);
  }

  .launcher button:hover {
    background: #fff;
  }

  .launcher button:active {
    background: var(--hover);
  }

  .col > .row {
    display: flex;
    gap: var(--border);
    background: var(--line);
  }

  /* Test window: equal boxes joined by connector lines */
  /* Grid: boxes on rows 1/3/5 and columns 1/3/5, connector lines in the gaps */
  .flow {
    display: grid;
    grid-template-columns: auto 34px auto 34px auto;
    grid-template-rows: auto 34px auto 34px auto;
    justify-items: center;
    align-items: center;
    background: var(--panel);
    padding: 28px;
  }

  .at-top-left     { grid-area: 1 / 1; }
  .at-input        { grid-area: 3 / 1; }
  .at-under-input  { grid-area: 5 / 1; }
  .at-model        { grid-area: 3 / 3; }
  .at-output       { grid-area: 3 / 5; }
  .at-under-output { grid-area: 5 / 5; }

  /* The border sits outside the square, so the inside stays exactly --square:
     224px is a whole 8x for a 28px MNIST digit and 7x for a 32px CIFAR image */
  .flow-box {
    box-sizing: border-box;
    width: calc(var(--square) + var(--border) * 2);
    height: calc(var(--square) + var(--border) * 2);
    flex: none;
    border: var(--border) solid var(--line);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--muted);
    font-size: 17px;
    font-weight: 700;
  }

  .flow-link {
    width: 34px;
    height: var(--border);
    background: var(--line);
  }

  .flow-link.down {
    width: var(--border);
    height: 34px;
  }

  /* clear, shuffle and submit: normal button height, full box width */
  .flow-box.btn {
    height: var(--btn-h);
    width: calc(var(--square) + var(--border) * 2);
  }

  .flow-box.shuffle {
    background: var(--panel);
    color: var(--text);
  }
  .flow-box.shuffle:hover  { background: var(--hover); }
  .flow-box.shuffle:active { background: #e3dccb; }

  .flow-box.clear {
    background: #e5401c;
    color: #fff;
  }
  .flow-box.clear:hover  { background: #f25531; }
  .flow-box.clear:active { background: #c93414; }

  .flow-box.submit {
    background: #2e9e4f;
    color: #fff;
  }
  .flow-box.submit:hover  { background: #37b35b; }
  .flow-box.submit:active { background: #268642; }

  /* Model box: a plain box like the others, with the die image as its background.
     The hover/active selectors are here to outrank the generic button hover. */
  .model-box,
  .model-box:hover,
  .model-box:active {
    position: relative;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px 16px;
    background: #000 url('/assets/die.png') center / cover no-repeat;
    color: #b9c6cd;
    text-align: center;
    overflow: hidden;
    overflow-wrap: anywhere;
    line-height: 1.3;
  }

  /* Scrim over the image so the text stays readable */
  .model-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }

  .model-box > * {
    position: relative;
    z-index: 1;
  }

  /* Nothing selected: the notice sits in the middle of the box */
  .model-box.empty {
    justify-content: center;
  }

  .model-box .model-name {
    color: #f4f9fb;
    font-size: 17px;
  }

  .model-box .model-stats {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .model-box .model-stats b {
    color: #8ee6b6;
    font-size: 22px;
    font-weight: 700;
  }

  /* Part number along the bottom */
  .model-box .model-arch {
    color: #9fb0b8;
    font: 600 12px/1.3 ui-monospace, Consolas, monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Output box holds the digit, with the confidence in its top-right corner */
  .output-box {
    position: relative;
  }

  /* CIFAR predictions are class names, so they need room to wrap */
  .output-digit.word {
    font-size: 34px;
    letter-spacing: 0;
    padding: 0 12px;
    text-align: center;
    overflow-wrap: anywhere;
  }

  .output-digit {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 160px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .output-box .conf-value {
    position: absolute;
    left: 0;
    right: 0;
    top: 12px;
    margin: 0;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  /* Test-set image, scaled up from 32x32 with the pixels kept crisp */
  .flow-box img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .flow-box canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    cursor: crosshair;
    touch-action: none;
  }

  /* Training window */
  :root {
    --accent: #2f6fd6;
    --row-h: 40px;
  }

  .train-main { width: 520px; }
  .train-side { width: 260px; }

  .swatch {
    display: inline-block;
    width: 14px;
    height: 3px;
    margin: 0 6px 0 14px;
    vertical-align: middle;
    background: var(--accent);
  }

  .swatch:first-child { margin-left: 0; }

  .acc-value {
    margin-left: auto;
    color: #e5401c;
    font-variant-numeric: tabular-nums;
  }

  .conf-value {
    margin-left: auto;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .spinner {
    width: 56px;
    height: 56px;
    box-sizing: border-box;
    border: 6px solid #e3dccb;
    border-top-color: #2f6fd6;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .swatch.acc {
    height: 4px;
    background: #e5401c;
  }

  /* The graph soaks up any spare height, so the column always ends flush with the
     args column however many rows that has */
  #graph {
    display: block;
    width: 520px;
    flex: 1 1 0;
    min-height: 300px;
    background: #fff;
  }

  /* Rows made of tiles: the row's gaps show the line colour */
  .col > .progress,
  .col > .arg-row {
    height: var(--row-h);
    display: grid;
    gap: var(--border);
    background: var(--line);
  }

  .progress { grid-template-columns: 90px 1fr; }
  .arg-row  { grid-template-columns: 1fr 100px; }

  .progress > *,
  .arg-row > * {
    background: var(--panel);
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
  }

  .progress > .progress-track {
    padding: 0;
    align-items: stretch;
    background: #fff;
  }

  .progress-fill {
    width: 0;
    background: #2e9e4f;
  }

  .arg-row > label {
    font-family: ui-monospace, Consolas, monospace;
  }

  .arg-row > input {
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: #fff;
    color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
    text-align: right;
    outline: none;
  }

  .arg-row > input:focus {
    box-shadow: inset 0 0 0 3px var(--accent);
  }

  .filler { flex: 1; }

  .col > .select-row {
    height: 48px;
    display: flex;
    background: #fff;
  }

  .select-row > select {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: #fff;
    color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 14px;
    padding: 0 10px;
    outline: none;
    cursor: pointer;
  }

  .select-row > select:focus {
    box-shadow: inset 0 0 0 3px var(--accent);
  }

  /* Drag-to-train slider */
  .slider {
    position: relative;
    height: var(--btn-h);
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }

  .slider-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 56px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
  }

  /* Knob sits inset in the rail; translateX moves it along */
  .slider-knob {
    position: absolute;
    top: 6px;
    left: 6px;
    width: calc(var(--btn-h) - 12px);
    height: calc(var(--btn-h) - 12px);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    border: 3px solid var(--line);
    border-radius: 50%;
    cursor: grab;
  }

  .slider-knob.dragging { cursor: grabbing; }

  .slider.cancel .slider-knob { background: #e5401c; }

  .slider.snap .slider-knob,
  .slider.snap .slider-hint {
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  #saveBtn,
  #confirmSaveBtn {
    background: #2e9e4f;
    color: #fff;
  }

  #saveBtn:hover,  #confirmSaveBtn:hover  { background: #37b35b; }
  #saveBtn:active, #confirmSaveBtn:active { background: #268642; }

  /* Models window: a box per model on the left, details of the clicked one on the right */
  .models-col  { width: 520px; }
  .model-details { width: 300px; }

  .col > .model-grid {
    flex: 1;
    min-height: 0;
    box-sizing: border-box;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    align-content: start;
    gap: 12px;
    padding: 12px;
    background: var(--panel);
  }

  .model-card {
    box-sizing: border-box;
    height: 96px;
    padding: 10px 12px;
    border: var(--border) solid var(--line);
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
  }

  .model-card.active,
  .model-card.active:hover {
    background: #e3dccb;
  }

  /* The most accurate model of the listed ones wears a gradient ring: the border is
     transparent, so the conic gradient behind it shows through only there */
  .model-card.best,
  .model-card.best:hover {
    border-color: transparent;
    background:
      linear-gradient(#fff, #fff) padding-box,
      conic-gradient(from 210deg, #ff5f6d, #ffc371, #7fd6a6, #2f6fd6, #a06cd5, #ff5f6d) border-box;
  }

  .model-card.best.active,
  .model-card.best.active:hover {
    background:
      linear-gradient(#e3dccb, #e3dccb) padding-box,
      conic-gradient(from 210deg, #ff5f6d, #ffc371, #7fd6a6, #2f6fd6, #a06cd5, #ff5f6d) border-box;
  }

  .model-card-top {
    display: flex;
    align-items: baseline;
    gap: 6px;
    width: 100%;
    font-size: 15px;
    font-weight: 700;
  }

  .model-card-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .model-card-acc {
    margin-left: auto;
    color: #e5401c;
    font-variant-numeric: tabular-nums;
  }

  .model-card-arch {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .model-card-meta {
    margin-top: auto;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .in-use {
    padding: 2px 6px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  .model-grid > .empty {
    grid-column: 1 / -1;
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 4px;
    color: var(--muted);
    font-weight: 600;
  }

  .col > .detail-desc {
    height: 64px;
    box-sizing: border-box;
    overflow-y: auto;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .detail-desc.none { color: var(--muted); }

  .col > .stat-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--border);
    background: var(--line);
  }

  .stat-grid > div {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 12px;
    background: var(--panel);
    font-size: 13px;
  }

  .stat-key { color: var(--muted); font-weight: 600; }
  .stat-val { font-weight: 700; font-variant-numeric: tabular-nums; }

  #useModelBtn {
    background: var(--accent);
    color: #fff;
  }

  /* Delete sits in the corner of the name row, quiet until you hover it */
  #deleteModelBtn {
    margin-left: auto;
    height: auto;
    padding: 2px 4px;
    background: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }

  #deleteModelBtn:hover,
  #deleteModelBtn:active { background: none; color: #e5401c; }

  #deleteModelBtn:disabled { opacity: 0.4; }

  #deleteModelBtn:disabled {
    background: var(--panel);
    color: var(--muted);
    cursor: default;
  }

  #useModelBtn:hover  { background: #3f7ee3; }
  #useModelBtn:active { background: #2860bb; }

  #useModelBtn:disabled {
    background: var(--panel);
    color: var(--muted);
    cursor: default;
  }

  /* Save window */
  .save-col { width: 380px; }
  .load-main { width: 360px; }
  .load-side { width: 300px; }

  /* The real file input is hidden; this row is the button and the chosen file name */
  .col > .file-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px 0 0;
    background: var(--panel);
  }

  .file-row > button { width: 150px; }

  .file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .file-name.chosen { color: var(--text); }

  #loadModelBtn {
    width: 100%;
    font-size: 15px;
  }

  #confirmLoadBtn {
    background: #2e9e4f;
    color: #fff;
  }

  #confirmLoadBtn:hover  { background: #37b35b; }
  #confirmLoadBtn:active { background: #268642; }

  .col > .name-row,
  .col > .desc-row {
    display: flex;
    background: #fff;
  }

  .col > .name-row { height: var(--btn-h); }
  .col > .desc-row { height: 120px; }

  .name-row > input,
  .desc-row > textarea {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 0 14px;
    outline: none;
  }

  .desc-row > textarea {
    padding: 12px 14px;
    resize: none;
  }

  .name-row > input:focus,
  .desc-row > textarea:focus {
    box-shadow: inset 0 0 0 3px var(--accent);
  }
</style>
</head>
<body>
  <div class="launcher" id="launcher">
    <h1>vis10n</h1>
    <div class="launcher-buttons">
      <button id="openTestBtn">MNIST test</button>
      <button id="openSetBtn">CIFAR test</button>
      <button id="openNetBtn">IMAGENET test</button>
      <button id="openTrainBtn">MNIST train</button>
    </div>
  </div>

  <div class="window" id="mainWindow" hidden>
    <div class="titlebar">
      <span>MNIST test</span>
      <button class="close" aria-label="Close">
        <svg width="8" height="8" viewBox="0 0 8 8">
          <path d="M1 1 L7 7 M7 1 L1 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="flow">
      <button class="flow-box btn clear at-top-left" id="clearBtn">clear</button>
      <div class="flow-link down" style="grid-area: 2 / 1"></div>
      <div class="flow-box at-input" id="inputBox">
        <canvas id="inputSquare" width="28" height="28"></canvas>
      </div>

      <div class="flow-link" style="grid-area: 3 / 2"></div>
      <button class="flow-box model-box at-model" id="modelBtn">
        <span class="model-name" id="modelBoxName">select model</span>
        <span class="model-stats" id="modelBoxStats"></span>
        <span class="model-arch" id="modelBoxArch"></span>
      </button>
      <div class="flow-link" style="grid-area: 3 / 4"></div>

      <div class="flow-box output-box at-output" id="outputBox">
        <div class="output-digit" id="outputSquare"></div>
        <span class="conf-value" id="confValue"></span>
      </div>
      <div class="flow-link down" style="grid-area: 4 / 5"></div>
      <button class="flow-box btn submit at-under-output" id="submitBtn">submit</button>
    </div>
  </div>

  <div class="window" id="setWindow" hidden>
    <div class="titlebar">
      <span>CIFAR test</span>
      <button class="close" aria-label="Close">
        <svg width="8" height="8" viewBox="0 0 8 8">
          <path d="M1 1 L7 7 M7 1 L1 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="flow">
      <button class="flow-box btn clear at-top-left" id="setClearBtn">clear</button>
      <div class="flow-link down" style="grid-area: 2 / 1"></div>
      <div class="flow-box at-input" id="setInputBox">
        <img id="setInputImg" alt="" hidden>
      </div>
      <div class="flow-link down" style="grid-area: 4 / 1"></div>
      <button class="flow-box btn shuffle at-under-input" id="setShuffleBtn">shuffle</button>

      <div class="flow-link" style="grid-area: 3 / 2"></div>
      <button class="flow-box model-box empty at-model" id="setModelBtn">
        <span class="model-name" id="setModelName">select model</span>
        <span class="model-stats" id="setModelStats"></span>
        <span class="model-arch" id="setModelArch"></span>
      </button>
      <div class="flow-link" style="grid-area: 3 / 4"></div>

      <div class="flow-box output-box at-output" id="setOutputBox">
        <div class="output-digit word" id="setOutputDigit"></div>
        <span class="conf-value" id="setConfValue"></span>
      </div>
      <div class="flow-link down" style="grid-area: 4 / 5"></div>
      <button class="flow-box btn submit at-under-output" id="setSubmitBtn">submit</button>
    </div>
  </div>

  <div class="window" id="netWindow" hidden>
    <div class="titlebar">

<script>
  const SIZE = 28;

  // Drawing on a 28x28 canvas; used by every window that takes a digit
  function setupDrawing(canvas) {
    const cctx = canvas.getContext('2d');

    function clear() {
      cctx.fillStyle = '#fff';
      cctx.fillRect(0, 0, SIZE, SIZE);
      cctx.fillStyle = '#000';
    }

    clear();

    let drawing = false;
    let last = null;

    // 2px strokes are closest to MNIST's stroke thickness
    const brushSize = 2;

    function toPixel(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.floor((e.clientX - rect.left) / rect.width * SIZE),
        y: Math.floor((e.clientY - rect.top) / rect.height * SIZE),
      };
    }

    // Bresenham line so fast drags don't leave gaps between pixels
    function drawLine(a, b) {
      let { x, y } = a;
      const dx = Math.abs(b.x - x), dy = -Math.abs(b.y - y);
      const sx = x < b.x ? 1 : -1, sy = y < b.y ? 1 : -1;
      let err = dx + dy;
      const shift = Math.floor((brushSize - 1) / 2);
      while (true) {
        cctx.fillRect(x - shift, y - shift, brushSize, brushSize);
        if (x === b.x && y === b.y) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x += sx; }
        if (e2 <= dx) { err += dx; y += sy; }
      }
    }

    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      last = toPixel(e);
      drawLine(last, last);
    });

    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = toPixel(e);
      drawLine(last, p);
      last = p;
    });

    function stop() {
      drawing = false;
      last = null;
    }

    canvas.addEventListener('pointerup', stop);
    canvas.addEventListener('pointercancel', stop);

    return { ctx: cctx, clear };
  }

  const input = document.getElementById('inputSquare');
  const { ctx, clear: clearInput } = setupDrawing(input);
  document.getElementById('clearBtn').addEventListener('click', clearInput);

  // Training args: add a line here to get a new input
  const TRAIN_ARGS = [
    { name: 'trainset_size', value: 10000, step: 1 },
    { name: 'testset_size',  value: 1000,  step: 1 },
    { name: 'batch_size',    value: 64,    step: 1 },
    { name: 'epochs',        value: 3,     step: 1 },
    { name: 'learning_rate', value: 0.001, step: 'any' },
  ];

  const argsCol = document.getElementById('argsCol');
  const argsFiller = argsCol.querySelector('.filler');

  for (const arg of TRAIN_ARGS) {
    const row = document.createElement('div');
    row.className = 'arg-row';
    row.innerHTML = `<label for="arg-${arg.name}">${arg.name}</label>
      <input id="arg-${arg.name}" type="number" step="${arg.step}" value="${arg.value}">`;
    argsCol.insertBefore(row, argsFiller);
  }

  function readArgs() {
    return Object.assign({ optimizer: optimizerSelect.value }, Object.fromEntries(TRAIN_ARGS.map(arg =>
      [arg.name, Number(document.getElementById(`arg-${arg.name}`).value)]
    )));
  }

  // Architecture picker: filled from the files in models/, keeping the current choice if it still exists
  const archSelect = document.getElementById('archSelect');
  const optimizerSelect = document.getElementById('optimizerSelect');

  async function refreshArchitectures(...selects) {
    const targets = selects.length ? selects : [archSelect];
    try {
      const res = await fetch('/api/architectures');
      const { architectures } = await res.json();
      for (const select of targets) {
        const current = select.value;
        select.replaceChildren(...architectures.map(arch => {
          const option = new Option(arch.name, arch.name);
          option.title = arch.description;
          return option;
        }));
        if (architectures.some(arch => arch.name === current)) select.value = current;
      }
    } catch (err) {
      console.error('could not load architectures:', err);
    }
  }

  async function refreshOptimizers() {
    try {
      const res = await fetch('/api/optimizers');
      const { optimizers } = await res.json();
      const current = optimizerSelect.value;
      optimizerSelect.replaceChildren(...optimizers.map(name => new Option(name, name)));
      if (optimizers.includes(current)) optimizerSelect.value = current;
    } catch (err) {
      console.error('could not load optimizers:', err);
    }
  }

  // Progress bars: fraction is 0..1
  function setProgress(id, fraction) {
    const el = document.getElementById(id);
    const pct = Math.round(Math.max(0, Math.min(fraction, 1)) * 100);
    el.querySelector('.progress-fill').style.width = `${pct}%`;
  }

  // Graph: loss per batch (left axis), accuracy per epoch (right axis)
  // A graph target is a canvas set up at a fixed size; drawGraph can draw on any of them
  function setupGraph(canvas, width, height) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    return { ctx, width, height };
  }

  const graphCanvas = document.getElementById('graph');
  const trainGraph = setupGraph(graphCanvas, 520, 300);

  // Match the canvas's pixels to the height it was actually laid out at
  function fitTrainGraph() {
    const height = Math.round(graphCanvas.clientHeight);
    if (!height || height === trainGraph.height) return;
    const dpr = window.devicePixelRatio || 1;
    graphCanvas.height = height * dpr;
    trainGraph.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    trainGraph.height = height;
  }

  function drawGraph({ loss = [], accuracy = [], batchesPerEpoch = 0, epochs = 0 } = {}, target = trainGraph) {
    const { ctx: gctx, width: GRAPH_W, height: GRAPH_H } = target;
    const pad = { l: 44, r: 48, t: 16, b: 28 };
    const w = GRAPH_W - pad.l - pad.r;
    const h = GRAPH_H - pad.t - pad.b;
    const totalBatches = Math.max(batchesPerEpoch * epochs, loss.length, 1);
    const maxLoss = Math.max(0.5, Math.ceil(Math.max(0, ...loss) * 2) / 2);
    const X = batch => pad.l + (batch / totalBatches) * w;
    const Y = frac => pad.t + h - frac * h;

    gctx.clearRect(0, 0, GRAPH_W, GRAPH_H);
    gctx.font = '11px system-ui, sans-serif';
    gctx.fillStyle = '#6b6760';

    // Horizontal grid + axis labels
    gctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = Y(i / 4);
      gctx.strokeStyle = '#ece8df';
      gctx.beginPath(); gctx.moveTo(pad.l, y); gctx.lineTo(pad.l + w, y); gctx.stroke();
      gctx.textBaseline = 'middle';
      gctx.textAlign = 'right';
      gctx.fillText((maxLoss * i / 4).toFixed(1), pad.l - 8, y);
      gctx.textAlign = 'left';
      gctx.fillText(`${i * 25}%`, pad.l + w + 8, y);
    }

    // Epoch boundaries
    gctx.textAlign = 'center';
    gctx.textBaseline = 'top';
    gctx.fillText('0', X(0), pad.t + h + 8);
    if (batchesPerEpoch && epochs) {
      gctx.setLineDash([4, 4]);
      for (let e = 1; e <= epochs; e++) {
        const x = X(e * batchesPerEpoch);
        if (e < epochs) {
          gctx.strokeStyle = '#d9d4c8';
          gctx.beginPath(); gctx.moveTo(x, pad.t); gctx.lineTo(x, pad.t + h); gctx.stroke();
        }
        gctx.fillText(`epoch ${e}`, x - (e === epochs ? 20 : 0), pad.t + h + 8);
      }
      gctx.setLineDash([]);
    }

    // Loss line
    if (loss.length > 1) {
      gctx.strokeStyle = '#2f6fd6';
      gctx.lineWidth = 1.5;
      gctx.beginPath();
      loss.forEach((v, i) => {
        const x = X(i + 1), y = Y(v / maxLoss);
        i ? gctx.lineTo(x, y) : gctx.moveTo(x, y);
      });
      gctx.stroke();
    }

    // Accuracy line + points
    if (accuracy.length && batchesPerEpoch) {
      const pts = accuracy.map((a, e) => [X((e + 1) * batchesPerEpoch), Y(a)]);
      gctx.strokeStyle = gctx.fillStyle = '#e5401c';
      gctx.lineWidth = 2;
      gctx.beginPath();
      pts.forEach(([x, y], i) => i ? gctx.lineTo(x, y) : gctx.moveTo(x, y));
      gctx.stroke();
      for (const [x, y] of pts) {
        gctx.beginPath(); gctx.arc(x, y, 3.5, 0, Math.PI * 2); gctx.fill();
      }
    }

    // Axes frame
    gctx.strokeStyle = '#1f1f1f';
    gctx.lineWidth = 2;
    gctx.beginPath();
    gctx.moveTo(pad.l, pad.t); gctx.lineTo(pad.l, pad.t + h);
    gctx.lineTo(pad.l + w, pad.t + h); gctx.lineTo(pad.l + w, pad.t);
    gctx.stroke();
  }

  drawGraph();

  // Drag-to-train slider: only fires when dragged all the way to the end.
  // It toggles between start and cancel; the knob snaps back each time.
  const ARROW_SVG = `<svg width="20" height="16" viewBox="0 0 20 16">
    <path d="M2 8 H17 M11 2 L17 8 L11 14" fill="none" stroke="#fff" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function makeSlider(el, { onStart, onCancel }) {
    const knob = el.querySelector('.slider-knob');
    const hint = el.querySelector('.slider-hint');
    const INSET = 6;
    let startX = null;
    let x = 0;
    let running = false;

    knob.innerHTML = ARROW_SVG;

    const maxX = () => el.clientWidth - knob.offsetWidth - INSET * 2;

    function setX(v) {
      x = v;
      knob.style.transform = `translateX(${x}px)`;
      hint.style.opacity = 1 - x / maxX();
    }

    // Switch between the start and cancel looks
    function setRunning(value) {
      running = value;
      el.classList.toggle('cancel', running);
      hint.textContent = running ? 'cancel training' : 'start training';
    }

    knob.addEventListener('pointerdown', e => {
      knob.setPointerCapture(e.pointerId);
      knob.classList.add('dragging');
      el.classList.remove('snap');
      startX = e.clientX - x;
    });

    knob.addEventListener('pointermove', e => {
      if (startX === null) return;
      setX(Math.max(0, Math.min(e.clientX - startX, maxX())));
    });

    function release() {
      if (startX === null) return;
      startX = null;
      knob.classList.remove('dragging');
      el.classList.add('snap');
      const reachedEnd = x >= maxX() - 2;
      setX(0);
      if (!reachedEnd) return;

      if (running) {
        setRunning(false);
        onCancel();
      } else {
        setRunning(true);
        onStart();
      }
    }

    knob.addEventListener('pointerup', release);
    knob.addEventListener('pointercancel', release);

    // setRunning(false) is for when training finishes on its own
    return { setRunning };
  }

  // Training run: one websocket per run, streaming updates from train()
  let trainSocket = null;
  let run = null;
  let redrawQueued = false;

  function queueRedraw() {
    if (redrawQueued) return;
    redrawQueued = true;
    requestAnimationFrame(() => {
      redrawQueued = false;
      drawGraph(run);
    });
  }

  function handleUpdate(update) {
    switch (update.type) {
      case 'batch':
        run.loss.push(update.loss);
        run.batchesPerEpoch = update.batches;
        setProgress('epochProgress', update.batch / update.batches);
        setProgress('totalProgress', (update.epoch + update.batch / update.batches) / run.epochs);
        queueRedraw();
        break;

      case 'epoch':
        run.accuracy.push(update.accuracy);
        document.getElementById('accValue').textContent = `${(update.accuracy * 100).toFixed(1)}%`;
        setProgress('totalProgress', (update.epoch + 1) / run.epochs);
        queueRedraw();
        break;

      case 'done':
        console.log(update.cancelled ? 'training cancelled' : 'training done');
        endRun();
        break;

      case 'error':
        console.error('training error:', update.message);
        endRun();
        break;
    }
  }

  function endRun() {
    if (trainSocket) trainSocket.close();
    trainSocket = null;
    trainSlider.setRunning(false);
  }

  function startTraining() {
    const args = readArgs();
    run = { loss: [], accuracy: [], batchesPerEpoch: 0, epochs: args.epochs };
    setProgress('epochProgress', 0);
    setProgress('totalProgress', 0);
    document.getElementById('accValue').textContent = '–';
    drawGraph(run);

    const socket = new WebSocket(`ws://${location.host}/ws/train`);
    trainSocket = socket;

    socket.onopen = () => socket.send(JSON.stringify({ type: 'start', model: archSelect.value, args }));
    // Ignore messages from an older run that was cancelled
    socket.onmessage = e => {
      if (socket === trainSocket) handleUpdate(JSON.parse(e.data));
    };
    socket.onclose = () => {
      if (socket === trainSocket) endRun();
    };
  }

  function cancelTraining() {
    if (trainSocket && trainSocket.readyState === WebSocket.OPEN) {
      trainSocket.send(JSON.stringify({ type: 'cancel' }));
    }
    trainSocket = null;
  }

  const trainSlider = makeSlider(document.getElementById('trainSlider'), {
    onStart: startTraining,
    onCancel: cancelTraining,
  });


  // Windows: drag by title bar, close with the x, clicked window comes to the front
  let topZ = 1;

  function makeWindow(win) {
    const titlebar = win.querySelector('.titlebar');
    let dragStart = null;
    let placed = false;

    // Position the window, clamped so it stays fully inside the viewport
    function place(x, y) {
      const rect = win.getBoundingClientRect();
      const page = document.documentElement;
      const maxX = Math.floor(page.clientWidth - Math.ceil(rect.width));
      const maxY = Math.floor(page.clientHeight - Math.ceil(rect.height));
      win.style.left = `${Math.max(0, Math.min(x, maxX))}px`;
      win.style.top = `${Math.max(0, Math.min(y, maxY))}px`;
    }

    function bringToFront() {
      win.style.zIndex = ++topZ;
    }

    function open() {
      win.hidden = false;
      if (placed) {
        place(win.offsetLeft, win.offsetTop);
      } else {
        const rect = win.getBoundingClientRect();
        const page = document.documentElement;
        place((page.clientWidth - rect.width) / 2, (page.clientHeight - rect.height) / 2);
        placed = true;
      }
      bringToFront();
    }

    win.addEventListener('pointerdown', bringToFront, true);

    titlebar.addEventListener('pointerdown', e => {
      if (e.target.closest('.close')) return;
      titlebar.setPointerCapture(e.pointerId);
      titlebar.classList.add('dragging');
      dragStart = { x: e.clientX - win.offsetLeft, y: e.clientY - win.offsetTop };
    });

    titlebar.addEventListener('pointermove', e => {
      if (!dragStart) return;
      place(e.clientX - dragStart.x, e.clientY - dragStart.y);
    });

    function endDrag() {
      dragStart = null;
      titlebar.classList.remove('dragging');
    }

    titlebar.addEventListener('pointerup', endDrag);
    titlebar.addEventListener('pointercancel', endDrag);

    win.querySelector('.close').addEventListener('click', () => {
      win.hidden = true;
    });

    window.addEventListener('resize', () => {
      if (!win.hidden) place(win.offsetLeft, win.offsetTop);
    });

    return {
      open,
      close: () => { win.hidden = true; },
    };
  }

  const mainWindow = makeWindow(document.getElementById('mainWindow'));
  const trainWindow = makeWindow(document.getElementById('trainWindow'));
  const setWindow = makeWindow(document.getElementById('setWindow'));
  const netWindow = makeWindow(document.getElementById('netWindow'));

  document.getElementById('openTestBtn').addEventListener('click', mainWindow.open);
  document.getElementById('openSetBtn').addEventListener('click', setWindow.open);
  document.getElementById('openNetBtn').addEventListener('click', netWindow.open);
  document.getElementById('openTrainBtn').addEventListener('click', async () => {
    await Promise.all([refreshArchitectures(), refreshOptimizers()]);
    trainWindow.open();
    // Only laid out once visible, so size the graph now and redraw at the new size
    fitTrainGraph();
    drawGraph(run ?? undefined);
  });

  // Test set window: shuffle pulls a random image out of the CIFAR-10 test set.
  // The index comes back with it, so the server can be asked about the same image later.
  const setInputImg = document.getElementById('setInputImg');
  const setShuffleBtn = document.getElementById('setShuffleBtn');
  let setSample = null;

  function clearSetInput() {
    setSample = null;
    setInputImg.removeAttribute('src');
    setInputImg.hidden = true;
  }

  function flashShuffle(text) {
    setShuffleBtn.textContent = text;
    setTimeout(() => { setShuffleBtn.textContent = 'shuffle'; }, 1500);
  }

  // Returns whether a new image is on screen, so enter can shuffle and then submit
  async function shuffleSet() {
    try {
      const res = await fetch('/api/sample?dataset=CIFAR-10');
      const data = await res.json();
      if (!res.ok) {
        flashShuffle(typeof data.detail === 'string' ? data.detail : 'failed');
        return false;
      }
      setSample = data;
      setInputImg.src = data.image;
      setInputImg.hidden = false;
      clearSetOutput();
      return true;
    } catch (err) {
      console.error('could not load a test image:', err);
      flashShuffle('failed');
      return false;
    }
  }

  setShuffleBtn.addEventListener('click', shuffleSet);

  const setOutputDigit = document.getElementById('setOutputDigit');
  const setConfValue = document.getElementById('setConfValue');
  const setSubmitBtn = document.getElementById('setSubmitBtn');

  function clearSetOutput() {
    setOutputDigit.textContent = '';
    setConfValue.textContent = '';
  }

  document.getElementById('setClearBtn').addEventListener('click', () => {
    clearSetInput();
    clearSetOutput();
  });

  function flashSetSubmit(text) {
    setSubmitBtn.textContent = text;
    setTimeout(() => { setSubmitBtn.textContent = 'submit'; }, 1500);
  }

  // Only the image's index goes to the server, which reads the pixels out of the test set itself
  let setPredictRequest = 0;

  async function submitSet() {
    if (!selected['CIFAR-10']) return flashSetSubmit('pick a model');
    if (!setSample) return flashSetSubmit('shuffle first');

    const id = ++setPredictRequest;
    setOutputDigit.innerHTML = '<div class="spinner"></div>';
    setConfValue.textContent = '';

    try {
      const res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: selected['CIFAR-10'], dataset: 'CIFAR-10', index: setSample.index }),
      });
      const data = await res.json();
      if (id !== setPredictRequest) return;

      if (!res.ok) {
        clearSetOutput();
        flashSetSubmit(typeof data.detail === 'string' ? data.detail : 'failed');
        return;
      }
      setOutputDigit.textContent = data.class_name;
      setConfValue.textContent = `${(data.probabilities[data.label] * 100).toFixed(1)}%`;
    } catch (err) {
      if (id !== setPredictRequest) return;
      console.error('predict failed:', err);
      clearSetOutput();
      flashSetSubmit('failed');
    }
  }

  setSubmitBtn.addEventListener('click', submitSet);

  // ImageNet window: shuffle takes a photo from the Imagenette test set (10 of the 1000
  // classes, with labels); choose photo runs any image the user picks, which has no label.
  const netInputImg = document.getElementById('netInputImg');
  const netFile = document.getElementById('netFile');
  const netShuffleBtn = document.getElementById('netShuffleBtn');
  const netSubmitBtn = document.getElementById('netSubmitBtn');
  const netOutputLabel = document.getElementById('netOutputLabel');
  const netConfValue = document.getElementById('netConfValue');
  let netSample = null;   // { index } for a test image, or { file } for a chosen photo

  function clearNetOutput() {
    netOutputLabel.textContent = '';
    netConfValue.textContent = '';
  }

  function showNetImage(src) {
    netInputImg.src = src;
    netInputImg.hidden = false;
    clearNetOutput();
  }

  function flashNet(button, text, original) {
    button.textContent = text;
    setTimeout(() => { button.textContent = original; }, 1500);
  }

  async function shuffleNet() {
    try {
      const res = await fetch('/api/sample?dataset=ImageNet');
      const data = await res.json();
      if (!res.ok) {
        flashNet(netShuffleBtn, typeof data.detail === 'string' ? data.detail : 'failed', 'shuffle');
        return false;
      }
      netSample = { index: data.index, trueClass: data.class_name };
      showNetImage(data.image);
      return true;
    } catch (err) {
      console.error('could not load a test image:', err);
      flashNet(netShuffleBtn, 'failed', 'shuffle');
      return false;
    }
  }

  netShuffleBtn.addEventListener('click', shuffleNet);

  document.getElementById('netChooseBtn').addEventListener('click', () => netFile.click());

  netFile.addEventListener('change', () => {
    const file = netFile.files[0];
    if (!file) return;
    netSample = { file };
    // Shown from the file until the server sends back how it actually cropped it
    showNetImage(URL.createObjectURL(file));
  });

  let netPredictRequest = 0;

  async function submitNet() {
    if (!selected['ImageNet']) return flashNet(netSubmitBtn, 'pick a model', 'submit');
    if (!netSample) return flashNet(netSubmitBtn, 'shuffle first', 'submit');

    const id = ++netPredictRequest;
    netOutputLabel.innerHTML = '<div class="spinner"></div>';
    netConfValue.textContent = '';

    try {
      const model = encodeURIComponent(selected['ImageNet']);
      const res = netSample.file
        ? await fetch(`/api/predict/photo?model=${model}&dataset=ImageNet`,
            { method: 'POST', body: netSample.file })
        : await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: selected['ImageNet'], dataset: 'ImageNet', index: netSample.index }),
          });
      const data = await res.json();
      if (id !== netPredictRequest) return;

      if (!res.ok) {
        clearNetOutput();
        flashNet(netSubmitBtn, typeof data.detail === 'string' ? data.detail : 'failed', 'submit');
        return;
      }
      netOutputLabel.textContent = data.class_name;
      netConfValue.textContent = `${(data.confidence * 100).toFixed(1)}%`;
      // The server crops a chosen photo, so show what the model actually saw
      if (data.image) netInputImg.src = data.image;
    } catch (err) {
      if (id !== netPredictRequest) return;
      console.error('predict failed:', err);
      clearNetOutput();
      flashNet(netSubmitBtn, 'failed', 'submit');
    }
  }

  netSubmitBtn.addEventListener('click', submitNet);

  // Keyboard, in whichever test window is in front: space shuffles and then submits,
  // so a rhythm on space walks through the test set; enter submits what is on screen
  const keyedWindows = [
    { el: document.getElementById('setWindow'), shuffle: shuffleSet, submit: submitSet },
    { el: document.getElementById('netWindow'), shuffle: shuffleNet, submit: submitNet },
  ];

  function windowInFront() {
    const open = [...document.querySelectorAll('.window')].filter(win => !win.hidden);
    const front = open.sort((a, b) => (Number(a.style.zIndex) || 0) - (Number(b.style.zIndex) || 0)).pop();
    return keyedWindows.find(w => w.el === front) ?? null;
  }

  document.addEventListener('keydown', async e => {
    if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
    // Never steal keys from a text field
    if (e.target.closest('input, textarea, select')) return;
    const target = windowInFront();
    if (!target) return;

    if (e.key === ' ') {
      e.preventDefault();
      if (await target.shuffle()) target.submit();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      target.submit();
    }
  });

  // Models window: list of saved models; clicking one shows its details, "use this model" selects it
  const modelsWindow = makeWindow(document.getElementById('modelsWindow'));
  // Each test window has its own model box and its own selected model
  const modelBoxes = {
    'MNIST': {
      btn: document.getElementById('modelBtn'),
      name: document.getElementById('modelBoxName'),
      stats: document.getElementById('modelBoxStats'),
      arch: document.getElementById('modelBoxArch'),
    },
    'CIFAR-10': {
      btn: document.getElementById('setModelBtn'),
      name: document.getElementById('setModelName'),
      stats: document.getElementById('setModelStats'),
      arch: document.getElementById('setModelArch'),
    },
    'ImageNet': {
      btn: document.getElementById('netModelBtn'),
      name: document.getElementById('netModelName'),
      stats: document.getElementById('netModelStats'),
      arch: document.getElementById('netModelArch'),
    },
  };
  const modelList = document.getElementById('modelList');
  const detailName = document.getElementById('detailName');
  const detailDesc = document.getElementById('detailDesc');
  const detailStats = document.getElementById('detailStats');
  const useModelBtn = document.getElementById('useModelBtn');
  const modelsTitle = document.getElementById('modelsTitle');

  let models = [];            // [{ name, info }] from the server; info is null for older models
  let viewedModel = null;     // clicked in the list
  const selected = { 'MNIST': null, 'CIFAR-10': null, 'ImageNet': null };  // per dataset
  let pickerDataset = 'MNIST';  // what the window was opened for; only these models are listed

  // Models saved before the dataset was recorded are all MNIST
  const datasetOf = model => model.info?.dataset ?? 'MNIST';
  const shownModels = () => models.filter(model => datasetOf(model) === pickerDataset);

  const pct = v => (v == null ? null : `${(v * 100).toFixed(1)}%`);
  const num = v => (v == null ? null : Number(v).toLocaleString());
  const compact = v => (v >= 1000 ? `${+(v / 1000).toFixed(1)}k` : `${v}`);

  // One box per model: name, accuracy, architecture and a line of basic numbers
  function renderModelList() {
    const listed = shownModels();
    modelList.replaceChildren();
    if (!listed.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = `no saved ${pickerDataset} models`;
      modelList.append(empty);
      return;
    }

    // Whichever listed model scored highest gets the ring
    const accuracyOf = m => m.info?.results?.final_accuracy ?? -1;
    const best = listed.reduce((a, b) => (accuracyOf(b) > accuracyOf(a) ? b : a));
    const bestName = accuracyOf(best) > 0 ? best.name : null;

    for (const model of listed) {
      const { name, info } = model;
      const card = document.createElement('button');
      card.className = 'model-card';
      card.classList.toggle('active', name === viewedModel);
      card.classList.toggle('best', name === bestName);

      const top = document.createElement('span');
      top.className = 'model-card-top';
      const label = document.createElement('span');
      label.className = 'model-card-name';
      label.textContent = name;
      top.append(label);
      if (name === selected[pickerDataset]) {
        const tag = document.createElement('span');
        tag.className = 'in-use';
        tag.textContent = 'in use';
        top.append(tag);
      }
      const acc = document.createElement('span');
      acc.className = 'model-card-acc';
      acc.textContent = pct(info?.results?.final_accuracy) ?? '';
      top.append(acc);

      const arch = document.createElement('span');
      arch.className = 'model-card-arch';
      arch.textContent = info?.model ?? '';

      const meta = document.createElement('span');
      meta.className = 'model-card-meta';
      meta.textContent = info?.args
        ? `${info.args.epochs} ep · ${compact(info.args.trainset_size)} imgs · ${compact(info.parameters?.total ?? 0)} params`
        : 'no info saved';

      card.append(top, arch, meta);
      card.addEventListener('click', () => viewModel(name));
      modelList.append(card);
    }
  }

  function renderDetails() {
    const model = models.find(m => m.name === viewedModel);
    const info = model?.info;
    const { args, results, parameters, environment } = info ?? {};

    detailName.textContent = model ? model.name : 'no model';

    detailDesc.textContent = info?.description || (model ? (info ? 'no description' : 'no info saved for this model') : '');
    detailDesc.classList.toggle('none', !info?.description);

    const stats = [
      ['predicts', info ? datasetOf(model) : null],
      ['final acc', pct(results?.final_accuracy)],
      ['best acc', pct(results?.best_accuracy)],
      ['final loss', results?.final_loss?.toFixed(3)],
      ['params', num(parameters?.total)],
      ['epochs', args?.epochs],
      ['batch size', args?.batch_size],
      ['learning rate', args?.learning_rate],
      ['optimizer', args?.optimizer],
      ['train images', num(args?.trainset_size)],
      ['test images', num(args?.testset_size)],
      ['train time', environment ? `${environment.train_seconds}s` : null],
      ['architecture', info?.model],
      ['saved', info?.saved?.slice(0, 10)],
    ];
    detailStats.replaceChildren(...stats.map(([key, value]) => {
      const cell = document.createElement('div');
      const k = document.createElement('span');
      const v = document.createElement('span');
      k.className = 'stat-key';
      v.className = 'stat-val';
      k.textContent = key;
      v.textContent = value ?? '–';
      cell.append(k, v);
      return cell;
    }));

    const inUse = model && model.name === selected[pickerDataset];
    useModelBtn.disabled = !model || inUse;
    useModelBtn.textContent = inUse ? 'in use' : 'use this model';
    resetDelete();
    deleteModelBtn.disabled = !model;
  }

  // Delete takes two clicks: the first asks to confirm, the second deletes
  const deleteModelBtn = document.getElementById('deleteModelBtn');
  let deleteArmed = false;
  let deleteTimer;

  function resetDelete() {
    deleteArmed = false;
    clearTimeout(deleteTimer);
    deleteModelBtn.textContent = 'delete';
  }

  deleteModelBtn.addEventListener('click', async () => {
    if (!viewedModel) return;
    if (!deleteArmed) {
      deleteArmed = true;
      deleteModelBtn.textContent = 'confirm?';
      deleteTimer = setTimeout(resetDelete, 3000);
      return;
    }

    const name = viewedModel;
    resetDelete();
    try {
      const res = await fetch(`/api/models/${encodeURIComponent(name)}`, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        deleteModelBtn.textContent = typeof data.detail === 'string' ? data.detail : 'failed';
        deleteTimer = setTimeout(resetDelete, 1500);
        return;
      }
    } catch (err) {
      console.error('delete failed:', err);
      return;
    }

    for (const dataset of Object.keys(selected)) {
      if (selected[dataset] === name) {
        selected[dataset] = null;
        renderModelBox(dataset);
      }
    }
    viewedModel = null;
    await refreshModels();
  });

  // The model box doubles as the picker: what is selected for that dataset, with a few stats
  function renderModelBox(dataset) {
    const box = modelBoxes[dataset];
    const name = selected[dataset];
    const info = models.find(m => m.name === name)?.info;

    box.name.textContent = name ?? 'select model';
    box.btn.classList.toggle('empty', !name);
    box.arch.textContent = info?.model ?? '';

    const acc = pct(info?.results?.final_accuracy);
    const params = info?.parameters?.total;
    box.stats.replaceChildren();
    if (acc) {
      const value = document.createElement('b');
      value.textContent = acc;
      const line = document.createElement('span');
      line.append(value, ' accuracy');
      box.stats.append(line);
    }
    if (params != null) {
      const line = document.createElement('span');
      line.textContent = `${num(params)} weights`;
      box.stats.append(line);
    }
  }

  function viewModel(name) {
    viewedModel = name;
    renderModelList();
    renderDetails();
  }

  useModelBtn.addEventListener('click', () => {
    if (!viewedModel) return;
    selected[pickerDataset] = viewedModel;
    renderModelBox(pickerDataset);
    modelsWindow.close();
  });

  async function refreshModels() {
    try {
      const res = await fetch('/api/models');
      models = (await res.json()).models;
    } catch (err) {
      console.error('could not load models:', err);
      models = [];
    }
    // Show the model in use if there is one, otherwise the first of this dataset
    const names = shownModels().map(m => m.name);
    const inUse = selected[pickerDataset];
    viewModel(names.includes(inUse) ? inUse : names[0] ?? null);
    for (const dataset of Object.keys(selected)) renderModelBox(dataset);
  }

  // Opened for one dataset at a time; the test windows predict digits, so MNIST
  async function openModelPicker(dataset) {
    pickerDataset = dataset;
    modelsTitle.textContent = `models - ${dataset}`;
    await refreshModels();
    modelsWindow.open();
  }

  modelBoxes['MNIST'].btn.addEventListener('click', () => openModelPicker('MNIST'));
  modelBoxes['CIFAR-10'].btn.addEventListener('click', () => openModelPicker('CIFAR-10'));
  modelBoxes['ImageNet'].btn.addEventListener('click', () => openModelPicker('ImageNet'));

  // Load window: takes a weights file trained elsewhere plus the details we can't read
  // off it, and hands both to the server
  const loadWindow = makeWindow(document.getElementById('loadWindow'));
  const loadFile = document.getElementById('loadFile');
  const loadFileName = document.getElementById('loadFileName');
  const loadNameInput = document.getElementById('loadName');
  const loadDataset = document.getElementById('loadDataset');
  const loadArch = document.getElementById('loadArch');
  const loadAcc = document.getElementById('loadAcc');
  const loadDesc = document.getElementById('loadDesc');
  const confirmLoadBtn = document.getElementById('confirmLoadBtn');

  document.getElementById('chooseFileBtn').addEventListener('click', () => loadFile.click());

  loadFile.addEventListener('change', () => {
    const file = loadFile.files[0];
    loadFileName.textContent = file ? file.name : 'no file chosen';
    loadFileName.classList.toggle('chosen', !!file);
    // The file name is a sensible default for the model name
    if (file && !loadNameInput.value.trim()) {
      loadNameInput.value = file.name.replace(/\.(pt|pth)$/i, '').replace(/[^\w\- ]+/g, '-');
    }
  });

  document.getElementById('loadModelBtn').addEventListener('click', async () => {
    loadDataset.value = pickerDataset;
    await refreshArchitectures(loadArch);
    loadWindow.open();
    loadNameInput.focus();
  });

  function flashLoad(text) {
    confirmLoadBtn.textContent = text;
    setTimeout(() => { confirmLoadBtn.textContent = 'load model'; }, 2000);
  }

  async function uploadModel() {
    const file = loadFile.files[0];
    if (!file) return flashLoad('pick a file');
    if (!loadNameInput.value.trim()) return flashLoad('name it first');
    if (!loadArch.value) return flashLoad('pick an architecture');

    const params = new URLSearchParams({
      name: loadNameInput.value.trim(),
      model: loadArch.value,
      dataset: loadDataset.value,
      description: loadDesc.value,
    });
    // Accuracy is stored as a fraction, like the trained models write it
    const accuracy = parseFloat(loadAcc.value);
    if (Number.isFinite(accuracy)) params.set('accuracy', `${accuracy / 100}`);

    confirmLoadBtn.textContent = 'loading...';
    try {
      const res = await fetch(`/api/upload?${params}`, { method: 'POST', body: file });
      const data = await res.json();
      if (!res.ok) {
        flashLoad(typeof data.detail === 'string' ? data.detail : 'failed');
        return;
      }
      console.log('loaded model into', data.path);
      loadFile.value = '';
      loadFileName.textContent = 'no file chosen';
      loadFileName.classList.remove('chosen');
      loadNameInput.value = '';
      loadAcc.value = '';
      loadDesc.value = '';
      confirmLoadBtn.textContent = 'load model';
      loadWindow.close();
      await refreshModels();
    } catch (err) {
      console.error('upload failed:', err);
      flashLoad('failed');
    }
  }

  confirmLoadBtn.addEventListener('click', uploadModel);
  loadNameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') uploadModel();
  });

  // Save window: asks for a name and description, then saves the last trained model
  const saveWindow = makeWindow(document.getElementById('saveWindow'));
  const modelNameInput = document.getElementById('modelName');
  const modelDescInput = document.getElementById('modelDesc');
  const confirmSaveBtn = document.getElementById('confirmSaveBtn');

  document.getElementById('saveBtn').addEventListener('click', () => {
    saveWindow.open();
    modelNameInput.focus();
  });

  function flashConfirm(text) {
    confirmSaveBtn.textContent = text;
    setTimeout(() => { confirmSaveBtn.textContent = 'save'; }, 1500);
  }

  async function saveModel() {
    try {
      const res = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: modelNameInput.value.trim(), description: modelDescInput.value }),
      });
      const data = await res.json();
      if (!res.ok) {
        flashConfirm(typeof data.detail === 'string' ? data.detail : 'invalid name');
        return;
      }
      console.log('saved model to', data.path);
      modelNameInput.value = '';
      modelDescInput.value = '';
      saveWindow.close();
    } catch (err) {
      console.error('save failed:', err);
      flashConfirm('save failed');
    }
  }

  confirmSaveBtn.addEventListener('click', saveModel);
  modelNameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') saveModel();
  });

  // Submit: send the drawing to the selected model, show the predicted digit
  const submitBtn = document.getElementById('submitBtn');
  const outputSquare = document.getElementById('outputSquare');

  function flashSubmit(text) {
    submitBtn.textContent = text;
    setTimeout(() => { submitBtn.textContent = 'submit'; }, 1500);
  }

  // Canvas is black on white; MNIST is white on black, so invert
  function readPixels() {
    const { data } = ctx.getImageData(0, 0, SIZE, SIZE);
    const pixels = [];
    for (let y = 0; y < SIZE; y++) {
      const row = [];
      for (let x = 0; x < SIZE; x++) row.push(255 - data[(y * SIZE + x) * 4]);
      pixels.push(row);
    }
    return pixels;
  }

  const confValue = document.getElementById('confValue');
  let predictRequest = 0;

  submitBtn.addEventListener('click', async () => {
    if (!selected['MNIST']) {
      flashSubmit('pick a model');
      return;
    }

    // Loading state; the id makes sure only the latest submit shows its result
    const id = ++predictRequest;
    outputSquare.innerHTML = '<div class="spinner"></div>';
    confValue.textContent = '';

    try {
      const res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: selected['MNIST'], dataset: 'MNIST', pixels: readPixels() }),
      });
      const data = await res.json();
      if (id !== predictRequest) return;

      if (!res.ok) {
        outputSquare.textContent = '';
        flashSubmit(typeof data.detail === 'string' ? data.detail : 'failed');
        return;
      }
      outputSquare.textContent = data.label;
      confValue.textContent = `${(data.probabilities[data.digit] * 100).toFixed(1)}%`;
    } catch (err) {
      if (id !== predictRequest) return;
      console.error('predict failed:', err);
      outputSquare.textContent = '';
      flashSubmit('failed');
    }
  });

  // Server connection check
  fetch('/api/ping')
    .then(res => res.json())
    .then(data => console.log('server ping:', data))
    .catch(err => console.warn('server not reachable:', err));
</script>
</body>
</html>
