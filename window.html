<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vis10n - test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --line: #1f1f1f;
    --border: 4px;
    --page: #486e88;
    --home-text: rgba(240, 246, 250, 0.92);
    --win-bg: #3c4f6d;
    --accent: #2f6fd6;
    --panel: #faf8f3;
    --text: #1f1f1f;
    --muted: #6b6760;
    --hover: #efe9dc;
    --square: 224px; /* 28px * 8 */
    --btn-h: 56px;
    --label-h: 40px;
  }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--page);
    font: 15px/1.2 system-ui, sans-serif;
    color: var(--text);
  }

  .window {
    position: absolute;
    border: var(--border) solid var(--line);
    border-radius: 14px;
    overflow: hidden; /* clips the titlebar, close button and panels to the rounded corners */
    background: var(--line);
    display: flex;
    flex-direction: column;
    gap: var(--border);
  }

  .titlebar {
    background: var(--win-bg);
    margin-bottom: calc(-1 * var(--border)); /* cancels the window's gap, so no line under the titlebar */
    color: #fff;
    height: 30px;
    padding: 0 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 14px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }

  .titlebar.dragging {
    cursor: grabbing;
  }

  .titlebar .close {
    /* The border sits outside the red, so the red stays a 30px square */
    width: calc(30px + var(--border));
    height: 30px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5401c;
    border: 0;
    border-left: var(--border) solid var(--line);
    border-radius: 0;
  }

  .titlebar .close:hover {
    background: #f25531;
  }

  .titlebar .close:active {
    background: #c93414;
  }

  /* Cells sit over the line colour; the gaps become the thick borders */
  .content {
    display: flex;
    gap: var(--border);
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: var(--border);
  }

  .col > * {
    background: var(--panel);
  }

  .label {
    height: var(--label-h);
    display: flex;
    align-items: center;
    padding: 0 14px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  button {
    height: var(--btn-h);
    border: 0;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    padding: 0 18px;
    cursor: pointer;
  }

  button:hover {
    background: var(--hover);
  }

  button:active {
    background: #e3dccb;
  }

  [hidden] { display: none !important; }

  /* No browser focus rings; text fields draw their own focus state */
  :focus, :focus-visible { outline: none; }

  /* No spinner buttons on number inputs */
  input[type=number] { appearance: textfield; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* Home background: blurred blobs with film grain, painted by grain-bg.js (see BACKGROUNDS) */
  #bg {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Flow: the class windows are laid out as one connected grid instead of free desktop windows.
     The focused window sits in the middle; its neighbours peek in at the screen edges. */
  .flow-stage {
    position: fixed;
    inset: 0;
    overflow: clip; /* clip, not hidden, so focusing an off-screen field can't scroll the stage */
  }

  /* Until the windows are laid out (and the fonts that size them are in), show only the background
     and the same spinner as the launcher's splash, so the swap from splash to app is seamless */
  /* On reveal the windows fade in over the unchanged background while the spinner fades out */
  .flow-stage { transition: opacity 0.3s ease-out; }
  html:not(.ready) .flow-stage { opacity: 0; visibility: hidden; }

  html.ready body::after { opacity: 0; visibility: hidden; }

  body::after {
    transition: opacity 0.2s ease-out, visibility 0s 0.2s;
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    box-sizing: border-box;
    border: 5px solid rgba(240, 246, 250, 0.25);
    border-top-color: rgba(240, 246, 250, 0.92);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .flow-stage.animate .flow-win,
  .flow-stage.animate .flow-wire {
    transition-property: left, top, width, height;
    transition-duration: 0.5s;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }

  .flow-wire {
    position: absolute;
    background: var(--line);
  }

  .flow-win .titlebar { cursor: default; }

  /* Unfocused windows are just targets: clicking anywhere on one navigates to it */
  .flow-win:not(.focused) { cursor: pointer; }
  .flow-win:not(.focused) > * { pointer-events: none; }

  /* Nav window: title and link columns */
  .nav-panel {
    background: var(--win-bg);
    padding: 44px 64px 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "IBM Plex Mono", Consolas, monospace;
    color: var(--home-text);
  }

  .nav-panel h1 {
    margin: 0 0 36px;
    white-space: nowrap;
    font-size: 64px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .nav-panel .columns {
    display: grid;
    grid-template-columns: repeat(3, max-content);
    gap: 56px;
  }

  .nav-panel h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }

  .nav-panel ul {
    list-style: none;
    margin: 0;
    padding: 0 0 0 10px;
    display: grid;
    gap: 10px;
  }

  .nav-panel li { display: flex; align-items: baseline; gap: 12px; }

  .nav-panel li::before {
    content: "";
    flex: none;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--home-text);
    transform: translateY(-3px);
  }

  .nav-panel button,
  .nav-panel button:hover,
  .nav-panel button:active {
    height: auto;
    padding: 0;
    background: none;
    color: var(--home-text);
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    white-space: nowrap;
  }


  .col > .row {
    display: flex;
    gap: var(--border);
    background: var(--line);
  }

  /* Test window: equal boxes joined by connector lines */
  /* Grid: boxes on rows 1/3/5 and columns 1/3/5, connector lines in the gaps */
  .flow {
    display: grid;
    grid-template-columns: auto 34px auto 34px auto;
    grid-template-rows: auto 34px auto 34px auto;
    justify-items: center;
    align-items: center;
    background: var(--win-bg);
    padding: 28px;
  }

  .at-top-left     { grid-area: 1 / 1; }
  .at-input        { grid-area: 3 / 1; }
  .at-under-input  { grid-area: 5 / 1; }
  .at-model        { grid-area: 3 / 3; }
  .at-output       { grid-area: 3 / 5; }
  .at-under-output { grid-area: 5 / 5; }

  /* The border sits outside the square, so the inside stays exactly --square:
     224px is a whole 8x for a 28px MNIST digit and 7x for a 32px CIFAR image */
  .flow-box {
    box-sizing: border-box;
    width: calc(var(--square) + var(--border) * 2);
    height: calc(var(--square) + var(--border) * 2);
    flex: none;
    border: var(--border) solid var(--line);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--muted);
    font-size: 17px;
    font-weight: 700;
  }

  .flow-link {
    width: 34px;
    height: var(--border);
    background: var(--line);
  }

  .flow-link.down {
    width: var(--border);
    height: 34px;
  }

  /* Per-window backgrounds: the design sits on the window itself, so it runs unbroken
     behind the titlebar and the panel, which go transparent */
  .window.themed > .titlebar,
  .window.themed > .flow {
    background: none;
  }

  /* Canvas-painted backgrounds (grain-bg.js): the canvas fills the window behind its contents */
  .window.themed { isolation: isolate; }
  .window > .win-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }


  /* clear, shuffle and submit: normal button height, full box width */
  .flow-box.btn {
    height: var(--btn-h);
    width: calc(var(--square) + var(--border) * 2);
  }

  .flow-box.shuffle {
    background: var(--panel);
    color: var(--text);
  }
  .flow-box.shuffle:hover  { background: var(--hover); }
  .flow-box.shuffle:active { background: #e3dccb; }

  .flow-box.clear {
    background: #e5401c;
    color: #fff;
  }
  .flow-box.clear:hover  { background: #f25531; }
  .flow-box.clear:active { background: #c93414; }

  .flow-box.submit {
    background: #2e9e4f;
    color: #fff;
  }
  .flow-box.submit:hover  { background: #37b35b; }
  .flow-box.submit:active { background: #268642; }

  /* Model box: a plain box like the others, with the die image as its background.
     The hover/active selectors are here to outrank the generic button hover. */
  .model-box,
  .model-box:hover,
  .model-box:active {
    position: relative;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px 16px;
    background: #000 url('/assets/die.png') center / cover no-repeat;
    color: #b9c6cd;
    text-align: center;
    overflow: hidden;
    overflow-wrap: anywhere;
    line-height: 1.3;
  }

  /* Scrim over the image so the text stays readable */
  .model-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }

  .model-box > * {
    position: relative;
    z-index: 1;
  }

  /* Nothing selected: the notice sits in the middle of the box */
  .model-box.empty {
    justify-content: center;
  }

  .model-box .model-name {
    color: #f4f9fb;
    font-size: 17px;
  }

  .model-box .model-stats {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .model-box .model-stats b {
    color: #8ee6b6;
    font-size: 22px;
    font-weight: 700;
  }

  /* Part number along the bottom */
  .model-box .model-arch {
    color: #9fb0b8;
    font: 600 12px/1.3 ui-monospace, Consolas, monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Output box holds the digit, with the confidence in its top-right corner */
  .output-box {
    position: relative;
  }

  /* CIFAR predictions are class names, so they need room to wrap */
  .output-digit.word {
    font-size: 34px;
    letter-spacing: 0;
    padding: 0 12px;
    text-align: center;
    overflow-wrap: anywhere;
  }

  .output-digit {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 160px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .output-box .conf-value {
    position: absolute;
    left: 0;
    right: 0;
    top: 12px;
    margin: 0;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  /* Test-set image, scaled up from 32x32 with the pixels kept crisp */
  .flow-box img {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  .flow-box canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    cursor: crosshair;
    touch-action: none;
  }

  /* Dream window: the constraints as toggles, a big digit input, and a result canvas
     that can't be drawn on */
  /* One row of four across the top, spanning from the digit box's left edge to the image box's right */
  #dreamToggles {
    grid-area: 1 / 1 / 2 / 6;
    justify-self: stretch;
  }

  .toggles {
    width: auto;
    height: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--border);
    background: var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  #dreamBtn { border-radius: 999px; }

  .toggles button {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 15px;
  }

  .toggles button::after {
    content: 'off';
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .toggles button.on,
  .toggles button.on:hover {
    background: var(--accent);
    color: #fff;
  }

  .toggles button.on::after {
    content: 'on';
    color: #fff;
  }

  /* Same size as the predicted digit in the test window */
  .digit-input {
    width: 100%;
    height: 100%;
    border: 0;
    padding: 0;
    background: none;
    text-align: center;
    font: 700 160px/1 system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    caret-color: transparent;
    outline: none;
  }

  .digit-input::placeholder { color: #d6d0c4; }

  #dreamCanvas { cursor: default; }

  /* Chess boards: 8x8 squares drawn from a FEN, pieces as text glyphs. --sq is one square's size. */
  .board-box { --sq: calc(var(--square) / 8); }
  .board-box.big {
    --sq: 56px;
    width: calc(var(--sq) * 8 + var(--border) * 2);
    height: calc(var(--sq) * 8 + var(--border) * 2);
  }

  /* Square and highlight colours; the play window takes its own from its cyanotype background */
  .chess-board {
    --light: #f3efe6;
    --dark: #9fb0b8;
    --mark: 47, 111, 214;   /* rgb of the highlights and move dots */
    position: relative;
    display: grid;
    grid-template-columns: repeat(8, var(--sq));
    grid-template-rows: repeat(8, var(--sq));
    user-select: none;
  }

  /* Layers, top to bottom: the piece (set per square as --piece), the highlight tint, the square colour */
  .chess-board > div {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    --tint: transparent;
    background:
      var(--piece, none) center / 100% no-repeat,
      linear-gradient(var(--tint), var(--tint)),
      var(--base);
  }

  #chessBoard {
    --light: #eaf2f8;
    --dark: #70a6d6;
    --mark: 22, 50, 92;     /* the background's ink */
    isolation: isolate;     /* keeps the painted squares below inside the board */
  }

  /* The play board's squares are painted with grain like the window behind it (see BOARD_TEXTURE),
     so the square cells themselves only carry the highlights and pieces */
  #chessBoard > .light, #chessBoard > .dark { --base: transparent; }

  .board-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  .chess-board > .light { --base: var(--light); }
  .chess-board > .dark  { --base: var(--dark); }

  .chess-board > .last     { --tint: rgba(var(--mark), 0.22); }
  .chess-board > .selected { --tint: rgba(var(--mark), 0.42); }

  /* A piece sliding to its new square, drawn over the board while it moves */
  .chess-board > .floating-piece {
    position: absolute;
    width: var(--sq);
    height: var(--sq);
    --base: transparent;
    pointer-events: none;
    z-index: 1;
    transition: transform 0.2s ease-out;
  }

  /* Where the selected piece can go: a dot on an empty square, a ring around a capture */
  .chess-board > .target::after {
    content: "";
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: rgba(var(--mark), 0.5);
  }
  .chess-board > .target.occupied::after {
    width: 88%;
    height: 88%;
    background: none;
    box-sizing: border-box;
    border: calc(var(--sq) / 12) solid rgba(var(--mark), 0.5);
  }

  /* Play window: a single row, so no empty rows above and below the board */
  .chess-flow { grid-template-rows: auto; }

  /* The two buttons stacked, as pills like the dream button */
  .chess-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .chess-controls > button { border-radius: 999px; }

  /* A move like Nxf3+ or a rating fits at this size */
  .output-digit.move { font-size: 64px; letter-spacing: 0; }

  /* Second line in an output box, along the bottom: the match's wins, draws and losses */
  .output-box .tally {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Match settings: a row of two across the top, like the dream toggles */
  #eloSettings {
    grid-area: 1 / 1 / 2 / 6;
    justify-self: stretch;
    grid-template-columns: repeat(2, 1fr);
  }

  #eloSettings label {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
  }

  #eloSettings input {
    width: 80px;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 4px 0;
    background: none;
    color: var(--text);
    font: 700 15px ui-monospace, Consolas, monospace;
    text-align: right;
  }

  #eloSettings input:focus { border-bottom-color: var(--accent); }

  #eloSettings.running { pointer-events: none; opacity: 0.6; }

  /* Greyed out until a match has given a rating */
  #eloSaveBtn:disabled {
    background: #d6d2c8;
    color: #fff;
    cursor: default;
  }

  #eloStartBtn.running        { background: #e5401c; }
  #eloStartBtn.running:hover  { background: #f25531; }
  #eloStartBtn.running:active { background: #c93414; }

  /* Training window */
  .swatch {
    display: inline-block;
    width: 14px;
    height: 3px;
    margin: 0 6px 0 14px;
    vertical-align: middle;
    background: var(--accent);
  }

  .swatch:first-child { margin-left: 0; }

  .acc-value {
    margin-left: auto;
    color: #e5401c;
    font-variant-numeric: tabular-nums;
  }

  .conf-value {
    margin-left: auto;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .spinner {
    width: 56px;
    height: 56px;
    box-sizing: border-box;
    border: 6px solid #e3dccb;
    border-top-color: #2f6fd6;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .swatch.acc {
    height: 4px;
    background: #e5401c;
  }

  .filler { flex: 1; }

  .col > .select-row {
    height: 48px;
    display: flex;
    background: #fff;
  }

  .select-row > select {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: #fff;
    color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
    font-size: 14px;
    padding: 0 10px;
    outline: none;
    cursor: pointer;
  }

  .select-row > select:focus {
    box-shadow: inset 0 0 0 3px var(--accent);
  }

  /* Drag-to-train slider */
  .slider {
    position: relative;
    height: var(--btn-h);
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }

  .slider-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 56px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
  }

  /* Knob sits inset in the rail; translateX moves it along */
  .slider-knob {
    position: absolute;
    top: 6px;
    left: 6px;
    width: calc(var(--btn-h) - 12px);
    height: calc(var(--btn-h) - 12px);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    border: 3px solid var(--line);
    border-radius: 50%;
    cursor: grab;
  }

  .slider-knob.dragging { cursor: grabbing; }

  .slider.cancel .slider-knob { background: #e5401c; }

  .slider.snap .slider-knob,
  .slider.snap .slider-hint {
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  /* Training window: a flow of white cells. Model and data settings feed the graph from the left,
     the graph flows down into progress and the start slider, and out to the right into save. */
  .train-flow {
    --gap-x: 72px;
    --gap-y: 48px;
    grid-template-columns: 260px var(--gap-x) 580px var(--gap-x) 260px;
    grid-template-rows: auto var(--gap-y) auto var(--gap-y) auto;
    justify-items: stretch;
  }

  .train-flow > .flow-link { width: 100%; }
  .train-flow > .flow-link.down { width: var(--border); height: 100%; justify-self: center; }

  .args-stack {
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* The two settings wires curve into one line that enters the graph. --y1 and --y2 are the
     centres of the two cells, measured in script; 50% is the graph's centre. */
  .args-merge {
    --r: 16px;
    position: relative;
    align-self: stretch;
  }

  .args-merge > i {
    position: absolute;
    box-sizing: border-box;
    border: 0 solid var(--line);
  }

  .args-merge > .elbow-top {
    left: 0;
    width: 50%;
    top: calc(var(--y1, 25%) - var(--border) / 2);
    bottom: calc(50% - var(--border) / 2);
    border-top-width: var(--border);
    border-right-width: var(--border);
    border-top-right-radius: var(--r);
  }

  .args-merge > .elbow-bottom {
    left: 0;
    width: 50%;
    top: calc(50% - var(--border) / 2);
    height: calc(var(--y2, 75%) - 50% + var(--border));
    border-bottom-width: var(--border);
    border-right-width: var(--border);
    border-bottom-right-radius: var(--r);
  }

  .args-merge > .merge-out {
    left: calc(50% - var(--border));
    right: 0;
    top: calc(50% - var(--border) / 2);
    height: var(--border);
    background: var(--line);
  }

  .train-cell {
    box-sizing: border-box;
    border: var(--border) solid var(--line);
    background: #fff;
    display: flex;
    flex-direction: column;
  }

  /* Settings, progress and save cells are softly rounded; the graph stays square */
  .train-cell:not(.graph-cell) {
    border-radius: 12px;
    overflow: hidden;
  }

  .graph-cell { align-self: stretch; }
  .save-cell  { align-self: center; }

  .cell-head {
    height: 36px;
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid #ece8df;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .cell-row {
    height: 42px;
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }

  .cell-row + .cell-row { border-top: 1px solid #f2efe8; }

  .cell-row > input,
  .cell-row > select {
    width: 110px;
    min-width: 0;
    border: 0;
    border-radius: 0;
    padding: 4px 0;
    background: none;
    color: var(--text);
    font: 700 15px ui-monospace, Consolas, monospace;
    text-align: right;
    text-align-last: right;
    outline: none;
    border-bottom: 2px solid transparent;
  }

  .cell-row > select { width: 140px; cursor: pointer; text-align: center; text-align-last: center; }

  .cell-row > input:focus,
  .cell-row > select:focus { border-bottom-color: var(--accent); }

  /* Loss legend left and accuracy legend right, matching the graph's axes; live accuracy in the middle */
  .graph-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    text-transform: none;
    letter-spacing: 0;
    font-size: 13px;
  }

  .graph-head > :last-child { justify-self: end; }
  .graph-head > .acc-value { margin-left: 0; font-size: 14px; }

  /* The canvas is taken out of the sizing, so the graph is exactly as tall as the cells beside it */
  .graph-box {
    flex: 1;
    position: relative;
  }

  #graph {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Progress: thin rounded bars */
  .progress { grid-template-columns: 56px 1fr; }

  .bar {
    height: 8px;
    border-radius: 4px;
    background: #ece8df;
    overflow: hidden;
  }

  .progress-fill {
    width: 0;
    height: 100%;
    background: #2e9e4f;
  }

  .train-flow > .slider {
    border: var(--border) solid var(--line);
    border-radius: calc(var(--btn-h) / 2 + var(--border));
    background: #fff;
  }

  /* Save: name, description and the save button; the button is greyed out until a run has finished */
  .save-cell textarea,
  .save-cell .name-input {
    border: 0;
    outline: none;
    background: none;
    color: var(--text);
    font: inherit;
    font-size: 14px;
  }

  .save-cell .name-input {
    height: 46px;
    padding: 0 14px;
    border-bottom: 1px solid #f2efe8;
  }

  .save-cell textarea {
    height: 96px;
    padding: 12px 14px;
    resize: none;
  }

  /* A pill at the bottom of the description, matching the start slider */
  #saveBtn {
    height: 52px;
    margin: 0 12px 12px;
    border-radius: 26px;
    background: #2e9e4f;
    color: #fff;
  }

  #saveBtn:hover  { background: #37b35b; }
  #saveBtn:active { background: #268642; }

  .train-flow:not(.has-model) #saveBtn {
    background: #d6d2c8;
    pointer-events: none;
  }

  /* Model picker: a dark overlay over the whole screen; the cards sit on it, above the details card */
  .picker {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    padding: 40px 40px 24px;
    box-sizing: border-box;
    background: rgba(6, 10, 18, 0.6);
    backdrop-filter: blur(10px);
  }

  .picker[hidden] { display: none; }

  .picker-title {
    color: var(--home-text);
    font: 500 15px "IBM Plex Mono", Consolas, monospace;
  }

  .model-grid {
    max-height: 408px;   /* three rows of cards, then it scrolls */
    padding: 6px;        /* room for a lifted card's outline */
    overflow-y: auto;
    scrollbar-width: none;   /* a scrollbar would squeeze the columns the chips are drawn for */
    display: grid;
    grid-template-columns: repeat(4, 242px);   /* chips are drawn at this card size */
    justify-content: center;
    align-content: start;
    gap: 12px;
  }

  /* A card is the model's chip, with its name and a short line about it along the bottom */
  .model-card {
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    height: 120px;
    padding: 10px 12px;
    border: var(--border) solid var(--line);
    background: #07070b;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2px;
    text-align: left;
    color: #fff;
  }

  /* The chip fills the card; the dark wash only rises behind the text, so the chip shows above it */
  .model-chip {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .model-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(7, 7, 11, 0.92) 0%, rgba(7, 7, 11, 0.7) 40%, rgba(7, 7, 11, 0.1) 85%);
  }

  .model-card > span { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }

  /* The one being viewed: lifted a little, with a white outline */
  .model-card.active {
    transform: translateY(-3px);
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  /* The most accurate model of the listed ones wears a gradient ring: the border is
     transparent, so the conic gradient behind it shows through only there */
  .model-card.best,
  .model-card.best:hover {
    border-color: transparent;
    background:
      linear-gradient(#07070b, #07070b) padding-box,
      conic-gradient(from 210deg, #ff5f6d, #ffc371, #7fd6a6, #2f6fd6, #a06cd5, #ff5f6d) border-box;
  }

  .model-card-top {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    font-size: 15px;
    font-weight: 700;
  }

  .model-card-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .model-card-acc {
    margin-left: auto;
    font: 700 14px ui-monospace, Consolas, monospace;
  }

  .model-card-sub {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
  }

  .in-use {
    flex: none;
    padding: 1px 7px;
    border-radius: 8px;
    background: #2e9e4f;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-shadow: none;
  }

  .model-grid > .empty {
    grid-column: 1 / -1;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(240, 246, 250, 0.6);
    font-weight: 600;
  }

  /* Details: a light card like the train window's cells */
  .model-details {
    width: 782px;
    box-sizing: border-box;
    border: var(--border) solid var(--line);
    border-radius: 12px;
    background: #fff;
    padding: 6px 18px 16px;
    display: flex;
    flex-direction: column;
  }

  /* Name on the left, the actions on the right */
  .detail-head {
    height: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
  }

  /* One line; the full description is its tooltip */
  .detail-desc {
    padding-bottom: 10px;
    font-size: 14px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .detail-desc.none { color: var(--muted); }

  /* Stats: label over value, seven to a row; a value too long to fit shows in full on hover */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px 14px;
    padding: 10px 0 4px;
    border-top: 1px solid #ece8df;
  }

  .stat-grid > div {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .stat-key { color: var(--muted); font-size: 12px; font-weight: 600; }
  .stat-val {
    font: 700 13px ui-monospace, Consolas, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Quiet text buttons before the use pill: delete, then load */
  #deleteModelBtn,
  #loadModelBtn {
    height: auto;
    padding: 4px 6px;
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  #deleteModelBtn { margin-left: auto; }
  #deleteModelBtn:hover, #deleteModelBtn:active { background: none; color: #e5401c; }
  #loadModelBtn:hover, #loadModelBtn:active { background: none; color: var(--text); }
  #deleteModelBtn:disabled { opacity: 0.4; cursor: default; }

  /* Use: a green pill, like the train window's save */
  #useModelBtn {
    margin-left: 4px;
    height: 48px;
    padding: 0 28px;
    border: var(--border) solid var(--line);
    border-radius: 28px;
    background: #2e9e4f;
    color: #fff;
  }

  #useModelBtn:hover  { background: #37b35b; }
  #useModelBtn:active { background: #268642; }

  #useModelBtn:disabled {
    background: #d6d2c8;
    cursor: default;
  }

  /* Load window */
  .load-main { width: 360px; }
  .load-side { width: 300px; }

  /* The real file input is hidden; this row is the button and the chosen file name */
  .col > .file-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px 0 0;
    background: var(--panel);
  }

  .file-row > button { width: 150px; }

  .file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .file-name.chosen { color: var(--text); }

  #confirmLoadBtn {
    background: #2e9e4f;
    color: #fff;
  }

  #confirmLoadBtn:hover  { background: #37b35b; }
  #confirmLoadBtn:active { background: #268642; }

  .col > .name-row,
  .col > .desc-row {
    display: flex;
    background: #fff;
  }

  .col > .name-row { height: var(--btn-h); }
  .col > .desc-row { height: 120px; }

  .name-row > input,
  .desc-row > textarea {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 0 14px;
    outline: none;
  }

  .desc-row > textarea {
    padding: 12px 14px;
    resize: none;
  }

  .name-row > input:focus,
  .desc-row > textarea:focus {
    box-shadow: inset 0 0 0 3px var(--accent);
  }
</style>

          <span><i class="swatch acc"></i>accuracy</span>
        </div>
        <div class="graph-box"><canvas id="graph"></canvas></div>
      </div>

      <div class="flow-link save-link" style="grid-area: 3 / 4"></div>
      <div class="train-cell save-cell" style="grid-area: 3 / 5">
        <input class="name-input" id="modelName" type="text" placeholder="model name" spellcheck="false">
        <textarea id="modelDesc" placeholder="description (optional)"></textarea>
        <button id="saveBtn">save model</button>
      </div>

      <div class="flow-link down" style="grid-area: 4 / 3"></div>
      <div class="train-cell" style="grid-area: 5 / 3">
        <div class="cell-row progress" id="epochProgress">
          <span>epoch</span><div class="bar"><div class="progress-fill"></div></div>
        </div>
        <div class="cell-row progress" id="totalProgress">
          <span>total</span><div class="bar"><div class="progress-fill"></div></div>
        </div>
      </div>
    </div>
  </div>

  </div>
  <!-- end flow stage -->

  <!-- Model picker: a dark overlay over the whole screen, the model cards on it and the viewed
       model's details in a light card at the bottom. Esc or a click on the dark part closes it. -->
  <div class="picker" id="modelsWindow" hidden>
    <div class="picker-title" id="modelsTitle">models - MNIST</div>
    <div class="model-grid" id="modelList"></div>

    <div class="model-details">
      <div class="detail-head">
        <span id="detailName">no model</span>
        <button id="deleteModelBtn">delete</button>
        <button id="loadModelBtn">+ load weights from a file</button>
        <button id="useModelBtn">use this model</button>
      </div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="stat-grid" id="detailStats"></div>
    </div>
  </div>

  <div class="window" id="loadWindow" hidden>
    <div class="titlebar">
      <span>load model</span>
      <button class="close" aria-label="Close">
        <svg width="8" height="8" viewBox="0 0 8 8">
          <path d="M1 1 L7 7 M7 1 L1 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="content">
      <div class="col load-main">
        <div class="label">Weights file</div>
        <div class="file-row">
          <input type="file" id="loadFile" accept=".pt,.pth" hidden>
          <button id="chooseFileBtn">choose file</button>
          <span class="file-name" id="loadFileName">no file chosen</span>
        </div>

        <div class="label">Name</div>
        <div class="name-row">
          <input id="loadName" type="text" placeholder="model name" spellcheck="false">
        </div>

        <div class="label">Description</div>
        <div class="desc-row">
          <textarea id="loadDesc" placeholder="optional"></textarea>
        </div>
      </div>

      <div class="col load-side">
        <div class="label">Predicts</div>
        <div class="select-row">
          <select id="loadDataset">
            <option value="MNIST">MNIST</option>
            <option value="CIFAR-10">CIFAR-10</option>
            <option value="ImageNet">ImageNet</option>
            <option value="Lichess">Lichess (chess moves)</option>
          </select>
        </div>

        <div class="label">Architecture</div>
        <div class="select-row">
          <select id="loadArch"></select>
        </div>

        <div class="label">Accuracy, % (optional)</div>
        <div class="name-row">
          <input id="loadAcc" type="number" step="0.1" min="0" max="100" placeholder="e.g. 97.5">
        </div>

        <div class="filler"></div>
        <button id="confirmLoadBtn">load model</button>
      </div>
    </div>
  </div>


<script>
  const SIZE = 28;

  // Drawing on a 28x28 canvas; used by every window that takes a digit
  function setupDrawing(canvas) {
    const cctx = canvas.getContext('2d');

    function clear() {
      cctx.fillStyle = '#fff';
      cctx.fillRect(0, 0, SIZE, SIZE);
      cctx.fillStyle = '#000';
    }

    clear();

    let drawing = false;
    let last = null;

    // 2px strokes are closest to MNIST's stroke thickness
    const brushSize = 2;

    function toPixel(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.floor((e.clientX - rect.left) / rect.width * SIZE),
        y: Math.floor((e.clientY - rect.top) / rect.height * SIZE),
      };
    }

    // Bresenham line so fast drags don't leave gaps between pixels
    function drawLine(a, b) {
      let { x, y } = a;
      const dx = Math.abs(b.x - x), dy = -Math.abs(b.y - y);
      const sx = x < b.x ? 1 : -1, sy = y < b.y ? 1 : -1;
      let err = dx + dy;
      const shift = Math.floor((brushSize - 1) / 2);
      while (true) {
        cctx.fillRect(x - shift, y - shift, brushSize, brushSize);
        if (x === b.x && y === b.y) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x += sx; }
        if (e2 <= dx) { err += dx; y += sy; }
      }
    }

    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      last = toPixel(e);
      drawLine(last, last);
    });

    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = toPixel(e);
      drawLine(last, p);
      last = p;
    });

    function stop() {
      drawing = false;
      last = null;
    }

    canvas.addEventListener('pointerup', stop);
    canvas.addEventListener('pointercancel', stop);

    return { ctx: cctx, clear };
  }

  const input = document.getElementById('inputSquare');
  const { ctx, clear: clearInput } = setupDrawing(input);
  document.getElementById('clearBtn').addEventListener('click', clearInput);

  // Training args: add a line here to get a new input; cell is the box it shows up in
  const TRAIN_ARGS = [
    { name: 'learning_rate', label: 'learning rate', cell: 'modelCell', value: 0.001, step: 'any' },
    { name: 'trainset_size', label: 'train set',     cell: 'dataCell',  value: 10000, step: 1 },
    { name: 'testset_size',  label: 'test set',      cell: 'dataCell',  value: 1000,  step: 1 },
    { name: 'batch_size',    label: 'batch size',    cell: 'dataCell',  value: 64,    step: 1 },
    { name: 'epochs',        label: 'epochs',        cell: 'dataCell',  value: 3,     step: 1 },
  ];

  for (const arg of TRAIN_ARGS) {
    const row = document.createElement('label');
    row.className = 'cell-row';
    row.innerHTML = `${arg.label}<input id="arg-${arg.name}" type="number" step="${arg.step}" value="${arg.value}">`;
    document.getElementById(arg.cell).append(row);
  }

  function readArgs() {
    return Object.assign({ optimizer: optimizerSelect.value }, Object.fromEntries(TRAIN_ARGS.map(arg =>
      [arg.name, Number(document.getElementById(`arg-${arg.name}`).value)]
    )));
  }

  // Architecture picker: filled from the files in models/, keeping the current choice if it still exists
  const archSelect = document.getElementById('archSelect');
  const optimizerSelect = document.getElementById('optimizerSelect');

  async function refreshArchitectures(...selects) {
    const targets = selects.length ? selects : [archSelect];
    try {
      const res = await fetch('/api/architectures');
      const { architectures } = await res.json();
      for (const select of targets) {
        const current = select.value;
        select.replaceChildren(...architectures.map(arch => {
          const option = new Option(arch.name, arch.name);
          option.title = arch.description;
          return option;
        }));
        if (architectures.some(arch => arch.name === current)) select.value = current;
      }
    } catch (err) {
      console.error('could not load architectures:', err);
    }
  }

  async function refreshOptimizers() {
    try {
      const res = await fetch('/api/optimizers');
      const { optimizers } = await res.json();
      const current = optimizerSelect.value;
      optimizerSelect.replaceChildren(...optimizers.map(name => new Option(name, name)));
      if (optimizers.includes(current)) optimizerSelect.value = current;
    } catch (err) {
      console.error('could not load optimizers:', err);
    }
  }

  // Progress bars: fraction is 0..1
  function setProgress(id, fraction) {
    const el = document.getElementById(id);
    const pct = Math.round(Math.max(0, Math.min(fraction, 1)) * 100);
    el.querySelector('.progress-fill').style.width = `${pct}%`;
  }

  // Graph: loss per batch (left axis), accuracy per epoch (right axis)
  const graphCanvas = document.getElementById('graph');
  const trainGraph = { ctx: graphCanvas.getContext('2d'), width: 0, height: 0 };

  // Match the canvas's pixels to the size it was laid out at; returns whether that changed
  function fitTrainGraph() {
    const width = Math.round(graphCanvas.clientWidth);
    const height = Math.round(graphCanvas.clientHeight);
    if (!width || !height || (width === trainGraph.width && height === trainGraph.height)) return false;
    const dpr = window.devicePixelRatio || 1;
    graphCanvas.width = width * dpr;
    graphCanvas.height = height * dpr;
    trainGraph.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    trainGraph.width = width;
    trainGraph.height = height;
    return true;
  }

  function drawGraph({ loss = [], accuracy = [], batchesPerEpoch = 0, epochs = 0 } = {}) {
    const { ctx: gctx, width: GRAPH_W, height: GRAPH_H } = trainGraph;
    const pad = { l: 44, r: 48, t: 16, b: 28 };
    const w = GRAPH_W - pad.l - pad.r;
    const h = GRAPH_H - pad.t - pad.b;
    const totalBatches = Math.max(batchesPerEpoch * epochs, loss.length, 1);
    const maxLoss = Math.max(0.5, Math.ceil(Math.max(0, ...loss) * 2) / 2);
    const X = batch => pad.l + (batch / totalBatches) * w;
    const Y = frac => pad.t + h - frac * h;

    gctx.clearRect(0, 0, GRAPH_W, GRAPH_H);
    gctx.font = '11px system-ui, sans-serif';
    gctx.fillStyle = '#6b6760';

    // Horizontal grid + axis labels
    gctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = Y(i / 4);
      gctx.strokeStyle = '#ece8df';
      gctx.beginPath(); gctx.moveTo(pad.l, y); gctx.lineTo(pad.l + w, y); gctx.stroke();
      gctx.textBaseline = 'middle';
      gctx.textAlign = 'right';
      gctx.fillText((maxLoss * i / 4).toFixed(1), pad.l - 8, y);
      gctx.textAlign = 'left';
      gctx.fillText(`${i * 25}%`, pad.l + w + 8, y);
    }

    // Epoch boundaries
    gctx.textAlign = 'center';
    gctx.textBaseline = 'top';
    gctx.fillText('0', X(0), pad.t + h + 8);
    if (batchesPerEpoch && epochs) {
      gctx.setLineDash([4, 4]);
      for (let e = 1; e <= epochs; e++) {
        const x = X(e * batchesPerEpoch);
        if (e < epochs) {
          gctx.strokeStyle = '#d9d4c8';
          gctx.beginPath(); gctx.moveTo(x, pad.t); gctx.lineTo(x, pad.t + h); gctx.stroke();
        }
        gctx.fillText(`epoch ${e}`, x - (e === epochs ? 20 : 0), pad.t + h + 8);
      }
      gctx.setLineDash([]);
    }

    // Loss line
    if (loss.length > 1) {
      gctx.strokeStyle = '#2f6fd6';
      gctx.lineWidth = 1.5;
      gctx.beginPath();
      loss.forEach((v, i) => {
        const x = X(i + 1), y = Y(v / maxLoss);
        i ? gctx.lineTo(x, y) : gctx.moveTo(x, y);
      });
      gctx.stroke();
    }

    // Accuracy line + points
    if (accuracy.length && batchesPerEpoch) {
      const pts = accuracy.map((a, e) => [X((e + 1) * batchesPerEpoch), Y(a)]);
      gctx.strokeStyle = gctx.fillStyle = '#e5401c';
      gctx.lineWidth = 2;
      gctx.beginPath();
      pts.forEach(([x, y], i) => i ? gctx.lineTo(x, y) : gctx.moveTo(x, y));
      gctx.stroke();
      for (const [x, y] of pts) {
        gctx.beginPath(); gctx.arc(x, y, 3.5, 0, Math.PI * 2); gctx.fill();
      }
    }

    // Axes frame
    gctx.strokeStyle = '#1f1f1f';
    gctx.lineWidth = 2;
    gctx.beginPath();
    gctx.moveTo(pad.l, pad.t); gctx.lineTo(pad.l, pad.t + h);
    gctx.lineTo(pad.l + w, pad.t + h); gctx.lineTo(pad.l + w, pad.t);
    gctx.stroke();
  }

  fitTrainGraph();
  drawGraph();

  // The graph's height follows the settings cells beside it, so refit whenever it changes
  new ResizeObserver(() => {
    if (fitTrainGraph()) drawGraph(run ?? undefined);
  }).observe(graphCanvas);

  // Where the two settings wires leave their cells, for the merge into the graph
  const argsMerge = document.getElementById('argsMerge');
  function placeArgsMerge() {
    const top = argsMerge.getBoundingClientRect().top;
    for (const [name, id] of [['--y1', 'modelCell'], ['--y2', 'dataCell']]) {
      const r = document.getElementById(id).getBoundingClientRect();
      argsMerge.style.setProperty(name, `${r.top + r.height / 2 - top}px`);
    }
  }
  new ResizeObserver(placeArgsMerge).observe(document.getElementById('argsStack'));

  // Drag-to-train slider: only fires when dragged all the way to the end.
  // It toggles between start and cancel; the knob snaps back each time.
  const ARROW_SVG = `<svg width="20" height="16" viewBox="0 0 20 16">
    <path d="M2 8 H17 M11 2 L17 8 L11 14" fill="none" stroke="#fff" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function makeSlider(el, { onStart, onCancel }) {
    const knob = el.querySelector('.slider-knob');
    const hint = el.querySelector('.slider-hint');
    const INSET = 6;
    let startX = null;
    let x = 0;
    let running = false;

    knob.innerHTML = ARROW_SVG;

    const maxX = () => el.clientWidth - knob.offsetWidth - INSET * 2;

    function setX(v) {
      x = v;
      knob.style.transform = `translateX(${x}px)`;
      hint.style.opacity = 1 - x / maxX();
    }

    // Switch between the start and cancel looks
    function setRunning(value) {
      running = value;
      el.classList.toggle('cancel', running);
      hint.textContent = running ? 'cancel training' : 'start training';
    }

    knob.addEventListener('pointerdown', e => {
      knob.setPointerCapture(e.pointerId);
      knob.classList.add('dragging');
      el.classList.remove('snap');
      startX = e.clientX - x;
    });

    knob.addEventListener('pointermove', e => {
      if (startX === null) return;
      setX(Math.max(0, Math.min(e.clientX - startX, maxX())));
    });

    function release() {
      if (startX === null) return;
      startX = null;
      knob.classList.remove('dragging');
      el.classList.add('snap');
      const reachedEnd = x >= maxX() - 2;
      setX(0);
      if (!reachedEnd) return;

      if (running) {
        setRunning(false);
        onCancel();
      } else {
        setRunning(true);
        onStart();
      }
    }

    knob.addEventListener('pointerup', release);
    knob.addEventListener('pointercancel', release);

    // setRunning(false) is for when training finishes on its own
    return { setRunning };
  }

  // Training run: one websocket per run, streaming updates from train()
  const trainFlow = document.getElementById('trainFlow');
  let trainSocket = null;
  let run = null;
  let redrawQueued = false;

  function queueRedraw() {
    if (redrawQueued) return;
    redrawQueued = true;
    requestAnimationFrame(() => {
      redrawQueued = false;
      drawGraph(run);
    });
  }

  function handleUpdate(update) {
    switch (update.type) {
      case 'batch':
        run.loss.push(update.loss);
        run.batchesPerEpoch = update.batches;
        setProgress('epochProgress', update.batch / update.batches);
        setProgress('totalProgress', (update.epoch + update.batch / update.batches) / run.epochs);
        queueRedraw();
        break;

      case 'epoch':
        run.accuracy.push(update.accuracy);
        document.getElementById('accValue').textContent = `${(update.accuracy * 100).toFixed(1)}%`;
        setProgress('totalProgress', (update.epoch + 1) / run.epochs);
        queueRedraw();
        break;

      case 'done':
        console.log(update.cancelled ? 'training cancelled' : 'training done');
        // The server only keeps a model from a run that finished, so only then can it be saved
        if (!update.cancelled) trainFlow.classList.add('has-model');
        endRun();
        break;

      case 'error':
        console.error('training error:', update.message);
        endRun();
        break;
    }
  }

  function endRun() {
    if (trainSocket) trainSocket.close();
    trainSocket = null;
    trainSlider.setRunning(false);
  }

  function startTraining() {
    const args = readArgs();
    run = { loss: [], accuracy: [], batchesPerEpoch: 0, epochs: args.epochs };
    trainFlow.classList.remove('has-model');
    setProgress('epochProgress', 0);
    setProgress('totalProgress', 0);
    document.getElementById('accValue').textContent = '–';
    drawGraph(run);

    const socket = new WebSocket(`ws://${location.host}/ws/train`);
    trainSocket = socket;

    socket.onopen = () => socket.send(JSON.stringify({ type: 'start', model: archSelect.value, args }));
    // Ignore messages from an older run that was cancelled
    socket.onmessage = e => {
      if (socket === trainSocket) handleUpdate(JSON.parse(e.data));
    };
    socket.onclose = () => {
      if (socket === trainSocket) endRun();
    };
  }

  function cancelTraining() {
    if (trainSocket && trainSocket.readyState === WebSocket.OPEN) {
      trainSocket.send(JSON.stringify({ type: 'cancel' }));
    }
    trainSocket = null;
  }

  const trainSlider = makeSlider(document.getElementById('trainSlider'), {
    onStart: startTraining,
    onCancel: cancelTraining,
  });


  // Windows: drag by title bar, close with the x, clicked window comes to the front
  let topZ = 1;

  function makeWindow(win) {
    const titlebar = win.querySelector('.titlebar');
    let dragStart = null;
    let placed = false;

    // Position the window, clamped so it stays fully inside the viewport
    function place(x, y) {
      const rect = win.getBoundingClientRect();
      const page = document.documentElement;
      const maxX = Math.floor(page.clientWidth - Math.ceil(rect.width));
      const maxY = Math.floor(page.clientHeight - Math.ceil(rect.height));
      win.style.left = `${Math.max(0, Math.min(x, maxX))}px`;
      win.style.top = `${Math.max(0, Math.min(y, maxY))}px`;
    }

    function bringToFront() {
      win.style.zIndex = ++topZ;
    }

    function open() {
      win.hidden = false;
      if (placed) {
        place(win.offsetLeft, win.offsetTop);
      } else {
        const rect = win.getBoundingClientRect();
        const page = document.documentElement;
        place((page.clientWidth - rect.width) / 2, (page.clientHeight - rect.height) / 2);
        placed = true;
      }
      bringToFront();
    }

    win.addEventListener('pointerdown', bringToFront, true);

    titlebar.addEventListener('pointerdown', e => {
      if (e.target.closest('.close')) return;
      titlebar.setPointerCapture(e.pointerId);
      titlebar.classList.add('dragging');
      dragStart = { x: e.clientX - win.offsetLeft, y: e.clientY - win.offsetTop };
    });

    titlebar.addEventListener('pointermove', e => {
      if (!dragStart) return;
      place(e.clientX - dragStart.x, e.clientY - dragStart.y);
    });

    function endDrag() {
      dragStart = null;
      titlebar.classList.remove('dragging');
    }

    titlebar.addEventListener('pointerup', endDrag);
    titlebar.addEventListener('pointercancel', endDrag);

    win.querySelector('.close').addEventListener('click', () => {
      win.hidden = true;
    });

    window.addEventListener('resize', () => {
      if (!win.hidden) place(win.offsetLeft, win.offsetTop);
    });

    return {
      open,
      close: () => { win.hidden = true; },
    };
  }

  // F5 or ctrl+R reloads the page, to pick up changes without restarting the app
  document.addEventListener('keydown', e => {
    if (e.key === 'F5' || (e.ctrlKey && e.key.toLowerCase() === 'r')) {
      e.preventDefault();
      location.reload();
    }
  });

  // Window backgrounds: each canvas gets its painter (see assets/), and repaints itself if its size
  // changes. The home page's own background is mounted right after its canvas, at the top of <body>.
  // Windows with one are marked .themed and have a <canvas class="win-bg"> as their first child.
  const trainSeed = equiluxSeed(EQUILUX_PRESETS.equilux);
  const dreamSeed = silkSeed(SILK_PRESETS.silk);
  const BACKGROUNDS = [
    ['#mainWindow > .win-bg',  c => paintGrainBg(c, PRESETS.coral)],                      // MNIST test
    ['#setWindow > .win-bg',   c => paintGrainBg(c, PRESETS.green)],                      // CIFAR test
    ['#netWindow > .win-bg',   c => paintRisoBg(c, RISO_PRESETS.dark)],                   // IMAGENET test
    ['#trainWindow > .win-bg', c => paintEquiluxBg(c, EQUILUX_PRESETS.equilux, trainSeed)], // MNIST train
    ['#dreamWindow > .win-bg', c => paintSilkBg(c, SILK_PRESETS.silk, dreamSeed)],          // MNIST dream
    ['#chessWindow > .win-bg', c => paintGrainBg(c, PRESETS.cyanotype)],                  // CHESS play
    ['#eloWindow > .win-bg',   c => paintGrainBg(c, PRESETS.bloom)],                      // CHESS elo
  ];
  for (const [selector, paint] of BACKGROUNDS) mountCanvasBg(document.querySelector(selector), paint);

  // Flow: the nav window and the class windows form one grid, run > train > lab left to right,
  // windows of the same class stacked vertically above and below the middle row. Only the middle row links sideways (like a gearstick).
  // The focused window is centred; each neighbour shows PEEK px at the matching screen edge.
  const flow = (() => {
    const PEEK = 40; // about 1cm
    // A neighbour only peeks in when there's at least this much room between it and the focused
    // window; otherwise it stays just off screen and only its wire runs to the edge
    const PEEK_ROOM = 20;
    const CELLS = [
      { id: 'navWindow',   x: 0,  y: 0 },
      { id: 'mainWindow',  x: -1, y: 0 },
      { id: 'setWindow',   x: -1, y: -1 },
      { id: 'netWindow',   x: -1, y: 1 },
      { id: 'trainWindow', x: 0,  y: 1 },
      { id: 'chessWindow', x: -1, y: 2 },
      { id: 'dreamWindow', x: 1,  y: 0 },
      { id: 'eloWindow',   x: 1,  y: 1 },
    ];

    const stage = document.getElementById('flowStage');
    const nodes = CELLS.map(cell => ({ ...cell, el: document.getElementById(cell.id), links: [] }));
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    const onFocus = {};

    // Links: vertical within a column, horizontal only along the middle row
    const wires = [];
    for (const a of nodes) {
      for (const b of nodes) {
        const across = a.y === 0 && b.y === 0 && b.x === a.x + 1;
        const down = a.x === b.x && b.y === a.y + 1;
        if (!across && !down) continue;
        const wire = { a, b, across, el: document.createElement('div') };
        wire.el.className = 'flow-wire';
        stage.prepend(wire.el);
        wires.push(wire);
        a.links.push({ node: b, dx: b.x - a.x, dy: b.y - a.y });
        b.links.push({ node: a, dx: a.x - b.x, dy: a.y - b.y });
      }
    }

    for (const n of nodes) {
      n.el.classList.add('flow-win');
      // Capture phase, so the click lands on the window rather than on whatever is inside it
      n.el.addEventListener('click', e => {
        if (n === focused) return;
        e.stopPropagation();
        e.preventDefault();
        go(n.id);
      }, true);
    }

    let focused = byId.navWindow;

    // Walk outward from the focused window. Direct neighbours peek in at the screen edge;
    // anything further is pushed well off screen. Each window is centred on the one it hangs off.
    function layout() {
      const vw = stage.clientWidth;
      const vh = stage.clientHeight;
      const box = new Map();
      for (const n of nodes) box.set(n, { w: n.el.offsetWidth, h: n.el.offsetHeight });

      const f = box.get(focused);
      f.x = (vw - f.w) / 2;
      f.y = (vh - f.h) / 2;
      const queue = [focused];
      const seen = new Set(queue);
      while (queue.length) {
        const p = queue.shift();
        const pb = box.get(p);
        for (const { node, dx, dy } of p.links) {
          if (seen.has(node)) continue;
          seen.add(node);
          queue.push(node);
          const nb = box.get(node);
          const direct = p === focused;
          // Room between the focused window's edge and the peek, on this side
          const room = dx > 0 ? vw - (pb.x + pb.w) - PEEK
            : dx < 0 ? pb.x - PEEK
            : dy > 0 ? vh - (pb.y + pb.h) - PEEK
            : pb.y - PEEK;
          const peek = room >= PEEK_ROOM ? PEEK : 0;
          if (dx) {
            nb.y = pb.y + (pb.h - nb.h) / 2;
            if (dx > 0) nb.x = direct ? vw - peek : pb.x + pb.w + vw / 2;
            else nb.x = direct ? peek - nb.w : pb.x - vw / 2 - nb.w;
          } else {
            nb.x = pb.x + (pb.w - nb.w) / 2;
            if (dy > 0) nb.y = direct ? vh - peek : pb.y + pb.h + vh / 2;
            else nb.y = direct ? peek - nb.h : pb.y - vh / 2 - nb.h;
          }
        }
      }

      for (const n of nodes) {
        const b = box.get(n);
        n.el.style.left = `${b.x}px`;
        n.el.style.top = `${b.y}px`;
      }

      // Wires run between facing edges, along the centre line the two windows share
      const t = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--border'));
      for (const { a, b, across, el } of wires) {
        const A = box.get(a);
        const B = box.get(b);
        if (across) {
          const cy = A.y + A.h / 2;
          Object.assign(el.style, {
            left: `${A.x + A.w}px`, width: `${B.x - A.x - A.w}px`,
            top: `${cy - t / 2}px`, height: `${t}px`,
          });
        } else {
          const cx = A.x + A.w / 2;
          Object.assign(el.style, {
            left: `${cx - t / 2}px`, width: `${t}px`,
            top: `${A.y + A.h}px`, height: `${B.y - A.y - A.h}px`,
          });
        }
      }
    }

    function go(id) {
      const target = byId[id];
      focused.el.classList.remove('focused');
      focused = target;
      focused.el.classList.add('focused');
      // windowInFront() picks the keyboard target by z-index
      focused.el.style.zIndex = ++topZ;
      layout();
      onFocus[id]?.();
    }

    new ResizeObserver(() => layout()).observe(stage);
    for (const n of nodes) new ResizeObserver(() => layout()).observe(n.el);

    // Arrow keys move to the neighbour in that direction
    const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    document.addEventListener('keydown', e => {
      const dir = ARROWS[e.key];
      if (!dir || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
      if (!document.getElementById('modelsWindow').hidden) return;   // the model picker is open
      // Never steal keys from a text field or dropdown
      if (e.target.closest('input, textarea, select')) return;
      const next = focused.links.find(l => l.dx === dir[0] && l.dy === dir[1]);
      if (!next) return;
      e.preventDefault();
      go(next.node.id);
    });

    go(focused.id);

    // Show the windows once they're settled, and only then turn on sliding,
    // so nothing visibly jumps or slides into place on load
    function reveal() {
      layout();
      document.documentElement.classList.add('ready');
      requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('animate')));
    }

    return { go, onFocus, reveal };
  })();

    if (e.key === ' ') {

      empty.textContent = `no saved ${pickerDataset} models`;
      modelList.append(empty);

    // Whichever listed model scored highest gets the ring: by rating once any of them has one
    const rated = listed.some(m => eloOf(m.info));
    const scoreOf = rated
      ? m => eloOf(m.info)?.elo ?? -1
      : m => m.info?.results?.final_accuracy ?? -1;
    const best = listed.reduce((a, b) => (scoreOf(b) > scoreOf(a) ? b : a));

  function renderDetails() {

    detailName.textContent = model ? model.name : 'no model';

          ['elo match', `${elo.games} games vs ${elo.opponent}`],

          ['final acc', pct(results?.final_accuracy)],
